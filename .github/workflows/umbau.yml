name: Umbau

# Startet, sobald update.zip im Hauptordner liegt (oder diese Datei geaendert wird).
on:
  push:
    paths:
      - 'update.zip'
      - '.github/workflows/umbau.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-update
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Umbau
        run: |
          set -euo pipefail
          if [ ! -f update.zip ]; then
            echo "Keine update.zip gefunden - nichts zu tun."
            exit 0
          fi

          rm -rf /tmp/upd && mkdir /tmp/upd
          unzip -q update.zip -d /tmp/upd

          # Dateien loeschen, die in _delete.txt stehen (eine pro Zeile, relativ zum Repo)
          if [ -f /tmp/upd/_delete.txt ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              case "$line" in ""|\#*) continue ;; esac
              case "$line" in /*|*..*|.git*|.github*) echo "Uebersprungen (nicht erlaubt): $line"; continue ;; esac
              if [ -e "$line" ]; then git rm -rq -- "$line" && echo "Geloescht: $line"; fi
            done < /tmp/upd/_delete.txt
            rm -f /tmp/upd/_delete.txt
          fi

          # Neue und geaenderte Dateien drueberkopieren (Ordner werden angelegt)
          cp -a /tmp/upd/. ./

          # Die ZIP selbst (und alte update-*.zip) wieder entfernen
          git rm -q --ignore-unmatch update.zip 'update-*.zip'
          rm -f update.zip update-*.zip

      - name: Aenderungen committen
        run: |
          set -euo pipefail
          git config user.name  "update-bot"
          git config user.email "update-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Update eingespielt"
            git push
          fi

