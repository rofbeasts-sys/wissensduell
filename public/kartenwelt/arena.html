function simBattle(X,Y){ if(S.round<=3) return {toA:0,toB:0};

  return {toB:Math.max(0,A.length?Math.min(CAPK,sA+ctx.kingA-ctx.wardB):0),toA:Math.max(0,B.length?Math.min(CAPK,sB+ctx.kingB-ctx.wardA):0)}; }
function startRound(){
  S.round++; S.P.gold+=income(S.P,S.round);

function toast(t){ log(t); }
