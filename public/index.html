// Bestmögliche Gegenmaßnahme gegen das Ablesen des Songnamens über die
// System-Mediensteuerung des Handys (Sperrbildschirm/Kontrollzentrum beim
// Herunterziehen): dort werden Metadaten aus der Media Session API gezeigt.
// Das eingebettete YouTube-iframe läuft in einem FREMDEN Origin (youtube.com)
// und setzt seine eigene Media Session dort selbst – darauf hat unsere Seite
// keinen Zugriff (Cross-Origin-Beschränkung des Browsers), kann sie also
// nicht direkt überschreiben. Diese Funktion setzt stattdessen auf UNSERER
// EIGENEN Seite bewusst harmlose Platzhalter-Metadaten; auf welche Media
// Session (iframe oder Hauptseite) das Betriebssystem letztlich zugreift,
// ist browser-/geräteabhängig unterschiedlich und nicht garantiert
// vollständig zu kontrollieren – das ist eine echte technische Grenze von
// eingebetteten Cross-Origin-Playern, keine unvollständige Umsetzung.
function suppressMusicMediaSession(){
  try{
    if(!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: '🎵 ???',
      artist: 'Rate mit!',
      album: 'Brain Pulse – Musik raten'
    });
    ['play','pause','stop','seekbackward','seekforward','previoustrack','nexttrack','seekto'].forEach(action => {
      try{ navigator.mediaSession.setActionHandler(action, () => {}); }catch(e){}
    });
  }catch(e){}
}
function clearMusicMediaSession(){
  try{
    if(!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = null;
    navigator.mediaSession.playbackState = 'none';
  }catch(e){}
}
let ytMediaSessionGuardId = null;
let ytOriginalDocTitle = null;
// Schummel-Schutz: der YouTube-Player läuft in einem eigenen (Cross-Origin-)
// iframe, das seinerseits versucht, DESSEN eigene Metadaten (echter
// Songtitel/Interpret/Thumbnail) in die Media Session zu schreiben – das ist
// genau das, was auf dem Handy z.B. im Sperrbildschirm oder beim Herunter-
// ziehen der Benachrichtigungsleiste sichtbar werden kann, selbst wenn der
// Player auf der Seite selbst unsichtbar/überdeckt ist. Einmaliges Über-
// schreiben reicht oft nicht, weil der iframe seine eigenen Daten jederzeit
// danach erneut setzen kann – daher wird hier alle 400ms erneut überschrieben,
// solange ein Hördurchgang läuft. Das ist eine Abwehrmaßnahme, keine
// Garantie: je nach Browser/Betriebssystem kann die Media Session dem
// tatsächlich Audio abspielenden Kontext (dem iframe) zugeordnet sein und
// sich dadurch nicht vollständig von der Elternseite aus überschreiben
// lassen. Zusätzlich wird der Browser-Tab-Titel während des Hördurchgangs
// maskiert und danach wiederhergestellt.
function startMusicMediaSessionGuard(){
  suppressMusicMediaSession();
  if(ytOriginalDocTitle === null) ytOriginalDocTitle = document.title;
  document.title = "🎵 Musik raten – Brain Pulse";
  if(ytMediaSessionGuardId) clearInterval(ytMediaSessionGuardId);
  ytMediaSessionGuardId = setInterval(suppressMusicMediaSession, 400);
}
function stopMusicMediaSessionGuard(){
  if(ytMediaSessionGuardId){ clearInterval(ytMediaSessionGuardId); ytMediaSessionGuardId = null; }
  clearMusicMediaSession();
  if(ytOriginalDocTitle !== null){ document.title = ytOriginalDocTitle; ytOriginalDocTitle = null; }
}

function startMusicPlayback(msg, startSeconds){
  loadYouTubeApi().then(() => {
    if(!party.musicMsg || party.musicMsg.index !== msg.index) return;
    const statusEl = document.getElementById("musicStatusText");
    const host = document.getElementById("musicPlayerHost");
    if(!host) return;
    if(ytStopTimer){ clearTimeout(ytStopTimer); ytStopTimer = null; }

    if(ytPlayer){
      // Player existiert schon (Wiederholung eines laufenden Songs) -> nur neu anspringen.
      try{
        ytPlayer.seekTo(startSeconds, true);
        ytPlayer.playVideo();
      }catch(e){}
      startMusicMediaSessionGuard();
      ytStopTimer = setTimeout(() => stopMusicPlayback(), (msg.clipSeconds||10)*1000);
      return;
    }

    ytPlayer = new YT.Player(host, {
      height: '1', width: '1',
      videoId: msg.youtubeId,
      playerVars: { autoplay: 1, controls: 0, start: startSeconds, disablekb: 1, fs: 0, modestbranding: 1, playsinline: 1 },
      events: {
        onReady: (e) => {
          try{
            e.target.seekTo(startSeconds, true);
            e.target.playVideo();
          }catch(err){}
          startMusicMediaSessionGuard();
          ytStopTimer = setTimeout(() => stopMusicPlayback(), (msg.clipSeconds||10)*1000);
        },
        onError: () => {
          if(statusEl) statusEl.textContent = "Video nicht verfügbar – trotzdem raten oder auf die Auflösung warten.";
        },
        onStateChange: (e) => {
          if(statusEl && e.data === YT.PlayerState.PLAYING){ statusEl.textContent = ""; startMusicMediaSessionGuard(); }
          // Manche Browser blockieren Autoplay mit Ton, bis der Nutzer interagiert hat.
          if(statusEl && e.data === YT.PlayerState.PAUSED && !party.musicManualStartShown){
            party.musicManualStartShown = true;
            statusEl.innerHTML = `<button class="btn btn-primary" style="margin-top:6px; padding:6px 14px;" onclick="manualStartMusic()">▶ Ton abspielen</button>`;
          }
        }
      }
    });
  });
}
function manualStartMusic(){
  if(ytPlayer){ try{ ytPlayer.playVideo(); }catch(e){} }
  startMusicMediaSessionGuard();
  const statusEl = document.getElementById("musicStatusText");
  if(statusEl) statusEl.textContent = "";
}
function stopMusicPlayback(){
  if(ytStopTimer){ clearTimeout(ytStopTimer); ytStopTimer = null; }
  if(ytPlayer){ try{ ytPlayer.pauseVideo(); }catch(e){} }
  stopMusicMediaSessionGuard();
}

// Rein optischer Fortschrittsbalken für den AKTUELLEN Hördurchgang (Erst-
// oder Wiederholungs-Durchgang); die eigentliche Stopp-Zeitsteuerung läuft
// separat über ytStopTimer.
function startMusicItemTicker(clipSeconds){
  if(party.musicTickerId) clearInterval(party.musicTickerId);
  const startedAt = Date.now();
  const durationMs = clipSeconds*1000;
  party.musicTickerId = setInterval(() => {
    const elapsed = Date.now() - startedAt;
    const remaining = Math.max(0, durationMs - elapsed);
    const fill = document.getElementById("musicTimerFill");
    if(fill) fill.style.width = Math.max(0,(remaining/durationMs)*100) + "%";
    if(remaining <= 0) clearInterval(party.musicTickerId);
  }, 150);
}

function requestMusicReplay(){
  const btn = document.getElementById("musicReplayBtn");
  if(btn) btn.disabled = true;
  partySend({action:'musicReplay'});
}
// Server broadcastet das an ALLE (geteilte Wiedergabe) – auch an alle, die
// selbst keine Wiederholung angefordert haben; wirkt sich auf deren
// Punkte-Obergrenze für die eigene (noch ausstehende) Abgabe aus.
function handleMusicReplayGranted(msg){
  party.musicReplaysUsed = msg.replaysUsed;
  const badge = document.getElementById("musicCapBadge");
  if(badge) badge.textContent = `bis zu ${msg.fieldMaxPoints} Punkte pro Feld`;
  const remaining = msg.maxReplays - msg.replaysUsed;
  const btn = document.getElementById("musicReplayBtn");
  if(btn){
    if(remaining > 0){
      btn.disabled = false;
      btn.textContent = `🔁 Nochmal hören (${remaining} übrig, -1 Punkt/Feld)`;
    } else {
      btn.style.display = "none";
    }
  }
  if(!party.musicSubmitted && party.musicMsg){
    startMusicPlayback(party.musicMsg, msg.startSeconds);
    startMusicItemTicker(msg.clipSeconds || 10);
  }
}

function submitPartyMusicGuess(){
  if(party.musicSubmitted) return;
  party.musicSubmitted = true;
  const artist = (document.getElementById("musicArtistInput")||{}).value || "";

  const year = (document.getElementById("musicYearInput")||{}).value || "";

  if(submitBtn) submitBtn.disabled = true;
  const replayBtn = document.getElementById("musicReplayBtn");
  if(replayBtn) replayBtn.disabled = true;
  const note = document.getElementById("musicWaitNote");
  if(note) note.classList.remove("hidden");
}

function startSlfTicker(msg){
  if(party.slfTickerId) clearInterval(party.slfTickerId);
  const startedAt = Date.now();
  party.slfTickerId = setInterval(() => {
    const elapsed = Date.now() - startedAt;
    const remaining = Math.max(0, msg.durationMs - elapsed);
    const fill = document.getElementById("slfTimerFill");
    const num = document.getElementById("slfTimerNum");
    if(fill){ fill.style.width = Math.max(0,(remaining/msg.durationMs)*100) + "%"; fill.classList.toggle("warn", remaining < msg.durationMs*0.2); }
    if(num) num.textContent = Math.ceil(remaining/1000) + "s";
    if(remaining <= 0){ clearInterval(party.slfTickerId); submitSlfAnswers(true); }
  }, 150);
}
// Jemand hat mit ALLEN Feldern ausgefüllt abgegeben -- der Server verkürzt die
// Restzeit für alle anderen auf msg.remainingMs. Lokalen Timer entsprechend
// neu starten (ab jetzt, nicht ab dem ursprünglichen Rundenstart) und
// Hinweis einblenden, damit die verkürzte Zeit nicht überraschend wirkt.
function handleSlfHurryUp(msg){
  if(!party.slfMsg) return;
  party.slfMsg = { ...party.slfMsg, durationMs: msg.remainingMs };
  startSlfTicker(party.slfMsg);
  const note = document.getElementById("slfHurryNote");
  if(note) note.classList.remove("hidden");
}
// Entprellter, laufender Zwischenstand an den Server (siehe Server-Kommentar
// bei handleSlfDraftUpdate: Absicherung gegen gedrosselte Timer auf mobilen
// Browsern, damit bei Zeitablauf nicht alles als leer gewertet wird, selbst
// wenn der lokale Auto-Abgabe-Timer verspätet/gar nicht feuert).
let slfDraftSyncTimeout = null;
function scheduleSlfDraftSync(){
  if(slfDraftSyncTimeout) clearTimeout(slfDraftSyncTimeout);
  slfDraftSyncTimeout = setTimeout(sendSlfDraftSync, 500);
}
function sendSlfDraftSync(){
  if(!party || !party.slfMsg || party.slfSubmitted) return;
  const answers = {};
  (party.slfMsg.categories||[]).forEach((cat,i) => {
    const el = document.getElementById("slfInput_"+i);
    answers[cat] = el ? el.value : "";
  });
  partySend({action:'slfDraftUpdate', answers});
}
function submitSlfAnswers(){
  if(party.slfSubmitted) return;
  party.slfSubmitted = true;
  if(slfDraftSyncTimeout){ clearTimeout(slfDraftSyncTimeout); slfDraftSyncTimeout = null; }
  if(party.slfTickerId) clearInterval(party.slfTickerId);
  const answers = {};
  (party.slfMsg.categories||[]).forEach((cat,i) => {
    const el = document.getElementById("slfInput_"+i);
    answers[cat] = el ? el.value : "";
  });
  partySend({action:'slfSubmit', answers});
  const btn = document.getElementById("slfSubmitBtn");
  if(btn){ btn.disabled = true; btn.textContent = "Abgegeben"; }
  const note = document.getElementById("slfWaitNote");
  if(note) note.classList.remove("hidden");
  document.querySelectorAll('[id^="slfInput_"]').forEach(el=>el.disabled=true);
}

function renderSlfReveal(msg){
  party.slfRevealMsg = msg;
  party.slfImReady = false;
  if(!party.slfChallenges) party.slfChallenges = [];
  const myId = party.playerId;
  renderApp(`
    <div class="panel">
      <div class="picker-title">AUFLÖSUNG – Buchstabe „${msg.letter}"</div>
      <div class="picker-sub">Vorläufige Punkte – jetzt anfechtbar, kein Zeitlimit</div>
      ${msg.categories.map((cat, catIndex) => `
        <div style="margin-top:16px;">
          <div style="font-weight:800; font-size:14px; margin-bottom:6px; color:var(--accent-2);">${cat}</div>
          <div class="round-plan-list">
            ${msg.players.map(p => {
              const text = (msg.answers[p.id]||{})[cat] || "";
              const pts = (msg.scores[p.id]||{})[cat] ?? 0;
              const challenge = (party.slfChallenges||[]).find(c => c.playerId===p.id && c.category===cat);
              const canChallenge = p.id !== myId && text && !challenge;
              const challengeNote = challenge ? (challenge.resolved
                ? (challenge.invalidated ? '<br><span style="font-size:11px; color:var(--danger);">❌ angefochten – ungültig</span>' : '<br><span style="font-size:11px; color:var(--accent-2);">✓ angefochten – bleibt gültig</span>')
                : '<br><span style="font-size:11px; color:var(--warn);">⏳ wird gerade angefochten …</span>') : '';
              const shownPts = (challenge && challenge.resolved && challenge.invalidated) ? 0 : pts;
              return `
                <div class="round-plan-item" style="align-items:center;">
                  <span style="flex:1;"><b>${p.name}:</b> ${text ? text : '<span style="color:var(--text-dim);">(leer)</span>'}${challengeNote}</span>
                  <span class="val" style="margin-right:8px;">${shownPts} P.</span>
                  ${canChallenge ? `<button class="bot-remove-btn" style="border-color:var(--warn); color:var(--warn);" onclick="raiseSlfChallenge('${p.id}', ${catIndex})" title="Anfechten">⚑</button>` : ``}
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `).join("")}
      <div id="slfVotePanel"></div>
      <div id="slfReadyPanel"></div>
    </div>
  `);
  renderSlfVotePanel();
  renderSlfReadyPanel();
}
function renderSlfVotePanel(){

  const myId = party.playerId;

  panel.innerHTML = `
    <div class="panel" style="margin-top:16px; border-color:var(--warn);">
      <div class="picker-title" style="font-size:15px;">Abstimmen: Ist diese Antwort gültig?</div>
      ${activeChallenges.map(c => `
        <div class="resolve-row" style="margin-top:8px;"><span>${c.category}: "${c.answerText}"</span></div>
        <div class="actions-row" style="margin-top:6px; margin-bottom:14px;">
          <button class="btn btn-primary" style="flex:1;" onclick="voteSlfChallenge('${c.id}', true)">✓ Gültig</button>
          <button class="btn btn-ghost" style="flex:1; border-color:var(--danger); color:var(--danger);" onclick="voteSlfChallenge('${c.id}', false)">✕ Ungültig</button>
        </div>
      `).join("")}
    </div>
  `;
}

  party.slfImReady = true;
  partySend({action:'slfChallengeReady'});
  renderSlfReadyPanel();
}
function updateSlfChallengeUI(){
  if(party.slfRevealMsg){ renderSlfVotePanel(); renderSlfReadyPanel(); }
}
function raiseSlfChallenge(targetPlayerId, catIndex){
  const category = party.slfRevealMsg.categories[catIndex];
  partySend({action:'slfChallenge', targetPlayerId, category});
}
function voteSlfChallenge(challengeId, valid){
  partySend({action:'slfVote', challengeId, valid});
  const panel = document.getElementById("slfVotePanel");
  if(panel) panel.innerHTML = '<p style="text-align:center; color:var(--text-dim); margin-top:10px;">Stimme abgegeben, warte auf die anderen …</p>';
}
function renderSlfFinal(msg){
  const revealMsg = party.slfRevealMsg || {players:[]};
  party.slfChallenges = [];
  renderApp(`
    <div class="panel">
      <div class="picker-title">ENDGÜLTIGE WERTUNG</div>
      <div class="round-plan-list" style="margin-top:10px;">
        ${(revealMsg.players||[]).map(p => {
          const catScores = msg.scores[p.id] || {};
          const total = Object.values(catScores).reduce((a,b)=>a+b,0);
          return `<div class="round-plan-item"><span style="flex:1;">${p.name}</span><span class="val">${total} P.</span></div>`;
        }).join("")}
      </div>
    </div>
  `);
}

/* ---------- Nenn's Blitz (Freitext-Kategorie, Anfechten-Mechanik wie SLF) ---------- */
function renderNennsBlitzAnswering(msg){
  party.nennsBlitzMsg = msg;
  party.nennsBlitzOwnAnswers = [];
  renderApp(`
    <div class="panel">
      <div class="picker-title">${msg.label}</div>
      <div class="picker-sub">Nenn so viele richtige Begriffe wie möglich!</div>
      <div class="timer-wrap" style="margin-top:10px;">
        <div class="timer-bar"><div id="blitzTimerFill" class="timer-fill" style="width:100%"></div></div>
        <div id="blitzTimerNum" class="timer-num">${Math.ceil(msg.durationMs/1000)}s</div>
      </div>
      <div class="picker-form" style="margin-top:14px;">
        <input type="text" id="blitzInput" class="builder-search" style="margin-top:0;" placeholder="Antwort eintippen …" autocomplete="off" autofocus onkeydown="if(event.key==='Enter')submitNennsBlitzAnswer()">
        <button class="btn btn-primary" onclick="submitNennsBlitzAnswer()">+</button>
      </div>
      <div class="picker-sub" style="margin-top:16px;">Deine Antworten (<span id="blitzOwnCount">0</span>)</div>
      <div id="blitzOwnList" class="round-plan-list" style="margin-top:6px;"></div>
    </div>
  `);
  startNennsBlitzTicker(msg);
  setTimeout(() => { const el = document.getElementById("blitzInput"); if(el) el.focus(); }, 50);
}
function submitNennsBlitzAnswer(){
  const input = document.getElementById("blitzInput");
  const text = (input && input.value || "").trim();
  if(!text) return;
  partySend({action:'nennsBlitzSubmit', text});
  if(input){ input.value = ""; input.focus(); }
}
function startNennsBlitzTicker(msg){
  if(party.blitzTickerId) clearInterval(party.blitzTickerId);
  const startedAt = Date.now();
  const totalMs = Math.max(1, msg.durationMs);
  party.blitzTickerId = setInterval(() => {
    const remaining = Math.max(0, totalMs - (Date.now() - startedAt));
    const fill = document.getElementById("blitzTimerFill");
    const num = document.getElementById("blitzTimerNum");
    if(fill){ fill.style.width = Math.max(0,(remaining/totalMs)*100) + "%"; fill.classList.toggle("warn", remaining < totalMs*0.3); }
    if(num) num.textContent = Math.ceil(remaining/1000) + "s";
    if(remaining <= 0) clearInterval(party.blitzTickerId);
  }, 100);
}
function handleNennsBlitzOwnUpdate(msg){
  party.nennsBlitzOwnAnswers = msg.answers;
  const countEl = document.getElementById("blitzOwnCount");
  const listEl = document.getElementById("blitzOwnList");
  if(countEl) countEl.textContent = msg.answers.length;
  if(listEl){
    listEl.innerHTML = msg.answers.slice().reverse().map(a => `<div class="round-plan-item"><span>${a.text}</span></div>`).join("");
  }
}

function renderNennsBlitzReveal(msg){
  party.nennsBlitzRevealMsg = msg;
  party.nennsBlitzChallenges = [];
  party.nennsBlitzImReady = false;
  if(party.blitzTickerId) clearInterval(party.blitzTickerId);
  const myId = party.playerId;
  renderApp(`
    <div class="panel">
      <div class="picker-title">AUFLÖSUNG: ${msg.label}</div>
      <div class="picker-sub">Vorläufige Punkte – jetzt anfechtbar, kein Zeitlimit</div>
      ${msg.players.map(p => {
        const answers = msg.answers[p.id] || [];
        return `
          <div style="margin-top:16px;">
            <div style="font-weight:800; font-size:14px; margin-bottom:6px; color:var(--accent-2);">${p.name} (${answers.length})</div>
            <div class="round-plan-list">
              ${answers.length === 0 ? `<div class="round-plan-item"><span style="color:var(--text-dim);">(keine Antworten)</span></div>` : answers.map(a => {
                const challenge = (party.nennsBlitzChallenges||[]).find(c => c.playerId===p.id && c.answerId===a.id);
                const canChallenge = p.id !== myId && !challenge;
                const challengeNote = challenge ? (challenge.resolved
                  ? (challenge.invalidated ? ' <span style="font-size:11px; color:var(--danger);">❌ angefochten – ungültig</span>' : ' <span style="font-size:11px; color:var(--accent-2);">✓ angefochten – bleibt gültig</span>')
                  : ' <span style="font-size:11px; color:var(--warn);">⏳ wird angefochten …</span>') : '';
                return `
                  <div class="round-plan-item" style="align-items:center;">
                    <span style="flex:1;">${a.text}${challengeNote}</span>
                    ${canChallenge ? `<button class="bot-remove-btn" style="border-color:var(--warn); color:var(--warn);" onclick="raiseNennsBlitzChallenge('${p.id}', '${a.id}')" title="Anfechten">⚑</button>` : ``}
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }).join("")}
      <div id="blitzVotePanel"></div>
      <div id="blitzReadyPanel"></div>
    </div>
  `);
  renderNennsBlitzVotePanel();
  renderNennsBlitzReadyPanel();
}
function renderNennsBlitzVotePanel(){
  const panel = document.getElementById("blitzVotePanel");
  if(!panel) return;
  const myId = party.playerId;
  const activeChallenges = (party.nennsBlitzChallenges||[]).filter(c => !c.resolved && c.playerId !== myId);
  if(activeChallenges.length === 0){ panel.innerHTML = ""; return; }
  panel.innerHTML = `
    <div class="panel" style="margin-top:16px; border-color:var(--warn);">
      <div class="picker-title" style="font-size:15px;">Abstimmen: Ist diese Antwort gültig?</div>
      ${activeChallenges.map(c => `
        <div class="resolve-row" style="margin-top:8px;"><span>"${c.answerText}"</span></div>
        <div class="actions-row" style="margin-top:6px; margin-bottom:14px;">
          <button class="btn btn-primary" style="flex:1;" onclick="voteNennsBlitzChallenge('${c.id}', true)">✓ Gültig</button>
          <button class="btn btn-ghost" style="flex:1; border-color:var(--danger); color:var(--danger);" onclick="voteNennsBlitzChallenge('${c.id}', false)">✕ Ungültig</button>
        </div>
      `).join("")}
    </div>
  `;
}
function renderNennsBlitzReadyPanel(){
  const panel = document.getElementById("blitzReadyPanel");
  if(!panel) return;
  const ready = party.nennsBlitzReadyCount || 0;
  const total = party.nennsBlitzReadyTotal || 0;
  const iAmReady = party.nennsBlitzImReady;
  panel.innerHTML = `
    <div class="panel" style="margin-top:16px;">
      <div class="picker-sub">${ready} von ${total} bereit</div>
      <div class="actions-row" style="margin-top:10px;">
        <button class="btn ${iAmReady?'btn-ghost':'btn-primary'}" style="flex:1;" ${iAmReady?'disabled':''} onclick="markNennsBlitzChallengeReady()">${iAmReady?'✓ Bereit gemeldet':'FERTIG'}</button>
        ${party.isHost ? `<button class="btn btn-primary" style="flex:1;" onclick="partySend({action:'continue'})">WEITER</button>` : ``}
      </div>
    </div>
  `;
}
function markNennsBlitzChallengeReady(){
  party.nennsBlitzImReady = true;
  partySend({action:'nennsBlitzChallengeReady'});
  renderNennsBlitzReadyPanel();
}
function updateNennsBlitzChallengeUI(){
  if(party.nennsBlitzRevealMsg){ renderNennsBlitzVotePanel(); renderNennsBlitzReadyPanel(); }
}
function raiseNennsBlitzChallenge(targetPlayerId, answerId){
  partySend({action:'nennsBlitzChallenge', targetPlayerId, answerId});
}
function voteNennsBlitzChallenge(challengeId, valid){
  partySend({action:'nennsBlitzVote', challengeId, valid});
  const panel = document.getElementById("blitzVotePanel");
  if(panel) panel.innerHTML = '<p style="text-align:center; color:var(--text-dim); margin-top:10px;">Stimme abgegeben, warte auf die anderen …</p>';
}
function renderNennsBlitzFinal(msg){
  party.nennsBlitzChallenges = [];
  renderApp(`
    <div class="panel">
      <div class="picker-title">ENDGÜLTIGE WERTUNG: ${msg.label}</div>
      <div class="round-plan-list" style="margin-top:10px;">
        ${msg.results.map(r => `<div class="round-plan-item"><span style="flex:1;">${r.name}</span><span class="val">${r.total} P.</span></div>`).join("")}
      </div>
    </div>
  `);
}

/* ---------- Rundenauswertung & Spielende ---------- */
function renderPartyRoundEnd(msg){
  if(party.soloMode){
    const mine = msg.teams[0];
    const won = msg.winnerTeamIds.includes(mine.id);
    renderApp(`
      <div class="panel">
        <div class="result-title">${t('round_of')} ${msg.roundNumber} ${t('round_of_mid')} ${msg.totalRounds} ${t('round_over')}</div>
        <div class="result-grid" style="margin-top:14px;">
          <div class="result-item ${msg.roundScores[mine.id]>=0?'pos':'neg'}">
            <div class="n">${msg.roundScores[mine.id]>=0?'+':''}${msg.roundScores[mine.id]}</div>
            <div class="l">${t('round_points')}</div>
          </div>
          <div class="result-item">
            <div class="n">${mine.score}</div>
            <div class="l">${t('total_points')}</div>
          </div>
        </div>
        ${won ? `<p style="color:var(--accent-2); font-weight:700; margin-top:14px; text-align:center;">${t('solo_round_done')}</p>` : ``}
        <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="partySend({action:'continue'})">
          ${msg.isLastRound ? t('final_eval') : t('next_round')}
        </button>
      </div>
    `);
    return;
  }

  const ranked = [...msg.teams].sort((a,b)=>b.score-a.score);
  const medals = ["🥇","🥈","🥉","4.","5.","6."];
  renderApp(`
    <div class="panel">
      <div class="result-title">${t('round_of')} ${msg.roundNumber} ${t('round_over')}</div>
      ${ranked.map((team,i) => `
        <div class="leaderboard-row">
          <div class="medal">${medals[i]}</div>
          <div>
            <div class="lname">${team.name}${msg.winnerTeamIds.includes(team.id) ? ' 👑' : ''}</div>
            <div class="lsub">${t('round_points_short')}: ${msg.roundScores[team.id] >= 0 ? '+' : ''}${msg.roundScores[team.id]}</div>
          </div>
          <div class="lright"><div class="lpoints">${team.score}</div><div class="lsub">${t('total_short')}</div></div>
        </div>
      `).join("")}
      ${party.isHost ? `
        <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="partySend({action:'continue'})">
          ${msg.isLastRound ? t('final_eval') : t('next_round')}
        </button>
      ` : `<p style="color:var(--text-dim); text-align:center; margin-top:14px;">${t('lobby_waiting_host')}</p>`}
    </div>
  `);
}

function renderPartyGameEnd(msg){
  if(party.soloMode){
    const mine = msg.ranking[0];
    renderApp(`
      <div class="panel">
        <div class="result-title">${t('solo_finished_title')}</div>
        <div class="result-sub">${t('solo_finished_sub')}</div>
        <div class="result-item" style="margin-top:14px;">
          <div class="n">${mine.score}</div>
          <div class="l">${t('total_points')}</div>
        </div>
        <div class="actions-row" style="margin-top:18px;">
          <button class="btn btn-primary" onclick="restartSoloParty()">${t('play_again')}</button>
          <button class="btn btn-ghost" onclick="partyLeave()">${t('main_menu')}</button>
        </div>
      </div>
    `);
    return;
  }

  const medals = ["🥇","🥈","🥉","4.","5.","6."];
  renderApp(`
    <div class="panel">
      <div class="result-title">${t('game_over')}</div>
      ${msg.ranking.map((team,i) => `
        <div class="leaderboard-row">
          <div class="medal">${medals[i]}</div>
          <div class="lname">${team.name}</div>
          <div class="lright"><div class="lpoints">${team.score}</div><div class="lsub">${t('points_word')}</div></div>
        </div>
      `).join("")}
      <div class="actions-row" style="margin-top:14px;">
        ${party.isHost ? `<button class="btn btn-primary" onclick="partySend({action:'restartLobby'})">${t('back_to_waiting_room')}</button>` : ``}
        <button class="btn btn-ghost" onclick="partyLeave()">${t('btn_leave_room')}</button>
      </div>
    </div>
  `);
}

/* ---------------------------------- START ---------------------------------- */
renderMainMenu();
restoreAccountSession().then(() => { if(account) renderMainMenu(); });
</script>
</body>
