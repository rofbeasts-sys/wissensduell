<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Brain Pulse</title>
<style>
  :root{
    --bg:#0a0d16; --bg-alt:#10141f; --panel:#151b2b; --panel-2:#1c2338; --line:#262e46;
    --text:#eef0fb; --text-dim:#9aa3c0; --accent:#7c6cf0; --accent-2:#21d6b8;
    --danger:#ff4d6a; --warn:#ffb443;
    --rank-none:#6b7280; --rank-listed:#7f93c2; --rank-bronze:#b6754a; --rank-silver:#b9c1d4;
    --rank-gold:#e3b23c; --rank-diamond:#3fd0e0; --rank-platin:#bfe3e0; --rank-master:#e0466e; --rank-grand:#f2c14e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, #1a2140 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #14243a 0%, transparent 55%),
      var(--bg);
    color:var(--text); font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100%;
  }
  #app{ max-width:960px; margin:0 auto; padding:20px 16px 60px; }
  .hidden{ display:none !important; }

  .statusbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .score-block{ position:relative; display:flex; align-items:baseline; gap:8px; }
  .score-num{ font-size:26px; font-weight:800; letter-spacing:-0.5px; }
  .score-label{ font-size:12px; color:var(--text-dim); }
  .rank-pill{ display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:999px; font-weight:700; font-size:13px; border:1px solid var(--line); }
  .rank-dot{ width:8px; height:8px; border-radius:50%; }
  .rank-none{color:var(--rank-none); border-color:color-mix(in srgb,var(--rank-none) 45%,var(--line));}
  .rank-listed{color:var(--rank-listed); border-color:color-mix(in srgb,var(--rank-listed) 45%,var(--line));}
  .rank-bronze{color:var(--rank-bronze); border-color:color-mix(in srgb,var(--rank-bronze) 45%,var(--line));}
  .rank-silver{color:var(--rank-silver); border-color:color-mix(in srgb,var(--rank-silver) 45%,var(--line));}
  .rank-gold{color:var(--rank-gold); border-color:color-mix(in srgb,var(--rank-gold) 45%,var(--line));}
  .rank-diamond{color:var(--rank-diamond); border-color:color-mix(in srgb,var(--rank-diamond) 45%,var(--line));}
  .rank-platin{color:var(--rank-platin); border-color:color-mix(in srgb,var(--rank-platin) 45%,var(--line));}
  .rank-master{color:var(--rank-master); border-color:color-mix(in srgb,var(--rank-master) 45%,var(--line));}
  .rank-grand{color:var(--rank-grand); border-color:color-mix(in srgb,var(--rank-grand) 45%,var(--line)); box-shadow:0 0 14px color-mix(in srgb,var(--rank-grand) 35%,transparent);}
  .rank-none .rank-dot{background:var(--rank-none);} .rank-listed .rank-dot{background:var(--rank-listed);}
  .rank-bronze .rank-dot{background:var(--rank-bronze);} .rank-silver .rank-dot{background:var(--rank-silver);}
  .rank-gold .rank-dot{background:var(--rank-gold);} .rank-diamond .rank-dot{background:var(--rank-diamond);}
  .rank-platin .rank-dot{background:var(--rank-platin);} .rank-master .rank-dot{background:var(--rank-master);}
  .rank-grand .rank-dot{background:var(--rank-grand);}

  .panel{ background:linear-gradient(180deg,var(--panel),var(--panel-2)); border:1px solid var(--line); border-radius:18px; padding:22px; }

  /* Hauptmenü */
  .lang-switcher{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
  .lang-chip{ background:var(--bg-alt); border:1.5px solid var(--line); border-radius:999px; padding:6px 12px; font-size:11px; font-weight:800; color:var(--text-dim); cursor:pointer; letter-spacing:0.5px; }
  .lang-chip.active{ color:var(--text); border-color:var(--accent); background:color-mix(in srgb, var(--accent) 18%, var(--bg-alt)); }
  .account-bar{ text-align:center; margin-top:10px; font-size:13px; color:var(--text-dim); }
  .account-link{ background:none; border:none; color:var(--accent-2); font-size:13px; font-weight:700; cursor:pointer; padding:0; font-family:inherit; text-decoration:underline; }
  .menu-hero{ text-align:center; margin: 30px 0 26px; }
  .menu-hero h1{
    font-size:42px; margin:0 0 8px; letter-spacing:-1px;
    background:linear-gradient(120deg,var(--text) 30%,var(--accent-2) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .menu-hero p{ color:var(--text-dim); margin:0; font-size:14px; }
  .menu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  @media (max-width:600px){ .menu-grid{ grid-template-columns:1fr; } }
  .mode-card{
    background:var(--bg-alt); border:1.5px solid var(--line); border-radius:16px;
    padding:26px 20px; text-align:left; cursor:pointer; color:var(--text);
    transition:border-color .15s ease, transform .1s ease;
  }
  .mode-card:hover{ border-color:var(--accent); }
  .mode-card:active{ transform:scale(0.98); }
  .mode-card .icon{ font-size:26px; margin-bottom:10px; }
  .mode-card h3{ margin:0 0 6px; font-size:19px; }
  .mode-card p{ margin:0; color:var(--text-dim); font-size:13px; line-height:1.5; }
  .menu-secondary{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

  .btn{ appearance:none; border:none; cursor:pointer; font-family:inherit; font-weight:700; font-size:15px; border-radius:14px; padding:14px 24px; transition:transform .12s ease, box-shadow .12s ease, background .2s ease; }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:linear-gradient(120deg,var(--accent),#5a4bd8); color:white; box-shadow:0 10px 24px -8px rgba(124,108,240,.6); }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--text); }
  .btn-block{ width:100%; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }

  /* Profilauswahl */
  .picker-title{ font-size:20px; font-weight:800; margin:0 0 4px; }
  .picker-sub{ color:var(--text-dim); font-size:13px; margin:0 0 18px; }
  .picker-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .picker-item{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--bg-alt); border:1.5px solid var(--line); border-radius:12px;
    padding:14px 16px; cursor:pointer; color:var(--text); font-weight:700; font-size:15px;
  }
  .picker-item:hover{ border-color:var(--accent); }
  .picker-item .sub{ font-size:12px; color:var(--text-dim); font-weight:500; }
  .picker-form{ display:flex; gap:8px; margin-top:6px; }
  .picker-form input{
    flex:1; background:var(--bg-alt); border:1.5px solid var(--line); border-radius:12px;
    padding:12px 14px; color:var(--text); font-size:15px; font-family:inherit;
  }
  .picker-form input:focus{ outline:none; border-color:var(--accent); }
  .slot-progress{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .slot-chip{ font-size:12px; padding:5px 12px; border-radius:999px; background:var(--bg-alt); border:1px solid var(--line); color:var(--text-dim); }
  .slot-chip.filled{ color:var(--accent-2); border-color:var(--accent-2); }

  .count-options{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:8px; }
  .count-btn{ background:var(--bg-alt); border:1.5px solid var(--line); border-radius:14px; padding:22px 10px; text-align:center; cursor:pointer; color:var(--text); font-weight:800; font-size:20px; }
  .count-btn span{ display:block; font-size:11px; font-weight:600; color:var(--text-dim); margin-top:4px; }
  .count-btn:hover{ border-color:var(--accent); }

  /* Spiel */
  .qmeta{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .qcount{ font-size:13px; color:var(--text-dim); font-weight:600; }
  .qcat{ font-size:12px; padding:4px 10px; border-radius:999px; background:var(--bg-alt); border:1px solid var(--line); color:var(--accent-2); font-weight:700; }
  .timer-wrap{ margin-bottom:16px; }
  .timer-bar{ height:8px; background:var(--bg-alt); border-radius:999px; overflow:hidden; border:1px solid var(--line); }
  .timer-fill{ height:100%; background:linear-gradient(90deg,var(--accent-2),var(--accent)); transition:width .2s linear, background .3s ease; }
  .timer-fill.warn{ background:linear-gradient(90deg,var(--warn),var(--danger)); }
  .timer-num{ font-size:12px; color:var(--text-dim); margin-top:5px; text-align:right; font-variant-numeric:tabular-nums; }
  .question-text{ font-size:20px; font-weight:700; line-height:1.4; margin:6px 0 20px; }
  .answers{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:560px){ .answers{ grid-template-columns:1fr; } }
  .answer-btn{
    text-align:left; background:var(--bg-alt); color:var(--text); border:1.5px solid var(--line);
    border-radius:14px; padding:16px 18px; font-size:15px; font-weight:600; cursor:pointer; min-height:64px;
    display:flex; align-items:center; gap:10px; transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .answer-btn:hover:not(:disabled){ border-color:var(--accent); }
  .answer-btn:active:not(:disabled){ transform:scale(0.985); }
  .answer-btn:disabled{ cursor:default; }
  .answer-letter{ width:26px; height:26px; border-radius:8px; background:var(--panel-2); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:var(--text-dim); flex-shrink:0; }
  .answer-btn.correct{ background:color-mix(in srgb,var(--accent-2) 22%,var(--bg-alt)); border-color:var(--accent-2); }
  .answer-btn.wrong{ background:color-mix(in srgb,var(--danger) 22%,var(--bg-alt)); border-color:var(--danger); }
  .answer-btn.correct .answer-letter{ background:var(--accent-2); color:#06231e; }
  .answer-btn.wrong .answer-letter{ background:var(--danger); color:#2b0710; }
  .explanation{ margin-top:16px; padding:14px 16px; border-radius:12px; background:var(--bg-alt); border:1px solid var(--line); font-size:13.5px; color:var(--text-dim); line-height:1.5; }
  .next-hint{ margin-top:14px; font-size:12px; color:var(--text-dim); text-align:right; }

  .avatar-circle{ width:34px; height:34px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:white; }

  /* Pass & Play */
  .pass-card{ text-align:center; padding:60px 20px; }
  .pass-card .avatar-big{ width:72px; height:72px; border-radius:20px; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:26px; color:white; }
  .pass-card h2{ font-size:24px; margin:0 0 8px; }
  .pass-card p{ color:var(--text-dim); font-size:14px; margin:0 0 26px; }

  .confirm-card{ text-align:center; padding:50px 20px; }
  .points-badge{ display:inline-block; font-size:34px; font-weight:800; padding:6px 18px; border-radius:14px; animation:floatUp .5s ease; }
  .points-badge.pos{ color:var(--accent-2); }
  .points-badge.neg{ color:var(--danger); }
  @keyframes floatUp{ from{ transform:translateY(10px); opacity:0; } to{ transform:translateY(0); opacity:1; } }

  .resolve-list{ display:flex; flex-direction:column; gap:10px; margin:18px 0; }
  .resolve-row{ display:flex; justify-content:space-between; align-items:center; background:var(--bg-alt); border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-weight:700; }
  .resolve-row .mark{ font-size:18px; }
  .resolve-row .mark.ok{ color:var(--accent-2); }
  .resolve-row .mark.bad{ color:var(--danger); }

  .result-title{ font-size:26px; font-weight:800; margin:0 0 4px; }
  .result-sub{ color:var(--text-dim); font-size:14px; margin:0 0 22px; }
  .result-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:20px; }
  .result-item{ background:var(--bg-alt); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .result-item .n{ font-size:22px; font-weight:800; }
  .result-item .l{ font-size:11px; color:var(--text-dim); }
  .result-item.pos .n{ color:var(--accent-2); }
  .result-item.neg .n{ color:var(--danger); }
  .rank-up-banner{ margin-bottom:18px; padding:14px 16px; border-radius:12px; background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 25%,var(--bg-alt)),color-mix(in srgb,var(--accent-2) 20%,var(--bg-alt))); border:1px solid var(--accent); font-size:14px; font-weight:700; }
  .actions-row{ display:flex; gap:10px; flex-wrap:wrap; }

  .leaderboard-row{ display:flex; align-items:center; gap:12px; background:var(--bg-alt); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; }
  .leaderboard-row .medal{ font-size:22px; width:30px; text-align:center; flex-shrink:0; }
  .leaderboard-row .lname{ font-weight:800; font-size:15px; }
  .leaderboard-row .lsub{ font-size:12px; color:var(--text-dim); }
  .leaderboard-row .lright{ margin-left:auto; text-align:right; }
  .leaderboard-row .lpoints{ font-weight:800; font-size:17px; }

  .stat-card{ background:var(--bg-alt); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:10px; }
  .stat-card .row1{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .stat-card .sname{ font-weight:800; font-size:16px; }
  .stat-mini{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat-mini div{ background:var(--panel-2); border-radius:10px; padding:8px; text-align:center; }
  .stat-mini .n{ font-weight:800; font-size:15px; }
  .stat-mini .l{ font-size:10px; color:var(--text-dim); }

  footer{ text-align:center; color:var(--text-dim); font-size:11px; margin-top:36px; }

  /* ---------- Party (WLAN) ---------- */
  .code-display{ font-size:44px; font-weight:800; letter-spacing:6px; text-align:center; margin:14px 0; color:var(--accent-2); }
  .party-players{ display:flex; flex-direction:column; gap:8px; margin:14px 0; }
  .party-player-row{ display:flex; align-items:center; gap:10px; background:var(--bg-alt); border:1px solid var(--line); border-radius:12px; padding:10px 14px; }
  .party-player-row .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent-2); flex-shrink:0; }
  .party-player-row.offline .dot{ background:var(--text-dim); }
  .party-player-row .team-tag{ margin-left:auto; font-size:11px; padding:3px 9px; border-radius:999px; background:var(--panel-2); color:var(--text-dim); }
  .bot-tier-select{ margin-left:auto; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:4px 8px; font-size:11px; font-family:inherit; }
  .bot-remove-btn{ background:transparent; border:1px solid var(--line); color:var(--danger); border-radius:8px; width:26px; height:26px; cursor:pointer; font-size:13px; flex-shrink:0; }
  .bot-remove-btn:hover{ border-color:var(--danger); }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); gap:12px; flex-wrap:wrap; }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row .label{ font-weight:700; font-size:14px; }
  .chip-group{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip-btn{ background:var(--bg-alt); border:1.5px solid var(--line); border-radius:999px; padding:7px 16px; font-size:13px; font-weight:700; color:var(--text-dim); cursor:pointer; }
  .chip-btn.active{ color:var(--text); border-color:var(--accent); background:color-mix(in srgb, var(--accent) 18%, var(--bg-alt)); }
  .builder-search{ width:100%; background:var(--bg-alt); border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; color:var(--text); font-size:14px; font-family:inherit; margin-top:6px; }
  .builder-search:focus{ outline:none; border-color:var(--accent); }
  .builder-category-list{ display:flex; flex-direction:column; gap:6px; margin-top:8px; max-height:220px; overflow-y:auto; }
  .builder-category-item{ background:var(--bg-alt); border:1.5px solid var(--line); border-radius:10px; padding:10px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  .builder-category-item:hover{ border-color:var(--accent); }
  .builder-category-item.active{ border-color:var(--accent-2); background:color-mix(in srgb, var(--accent-2) 16%, var(--bg-alt)); color:var(--text); }
  .round-plan-list{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .round-plan-item{ display:flex; align-items:center; gap:10px; background:var(--bg-alt); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:13px; }
  .round-plan-item .idx{ width:22px; height:22px; border-radius:6px; background:var(--panel-2); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0; }
  .round-plan-item select{ margin-left:auto; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:4px 8px; font-size:12px; font-family:inherit; }
  .team-slots{ display:flex; flex-direction:column; gap:14px; margin-top:10px; }
  .team-slot-card{ background:var(--bg-alt); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .team-slot-card h5{ margin:0 0 8px; font-size:13px; color:var(--accent-2); }
  .team-slot-card .members{ display:flex; gap:6px; flex-wrap:wrap; }
  .team-member-btn{ font-size:12px; padding:6px 12px; border-radius:999px; border:1.5px solid var(--line); background:var(--panel-2); color:var(--text); cursor:pointer; }
  .team-member-btn.taken{ opacity:0.35; cursor:default; }
  .turn-banner{ text-align:center; padding:14px; border-radius:14px; background:color-mix(in srgb, var(--accent) 20%, var(--bg-alt)); border:1px solid var(--accent); font-weight:800; margin-bottom:16px; }
  .hearts{ display:flex; gap:4px; }
  .heart{ font-size:16px; opacity:0.25; }
  .heart.on{ opacity:1; }
  .rank-board{ display:flex; flex-direction:column; gap:8px; margin:16px 0; }
  .rank-slot{ height:6px; }
  .rank-item-row{ display:flex; align-items:center; justify-content:space-between; background:var(--bg-alt); border:1px solid var(--line); border-radius:12px; padding:12px 16px; font-weight:700; }
  .rank-item-row .val{ color:var(--accent-2); font-weight:800; }
  .insert-btn{ width:100%; background:transparent; border:1.5px dashed var(--line); border-radius:10px; padding:8px; color:var(--text-dim); font-size:12px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .insert-btn:hover{ border-color:var(--accent); color:var(--text); }
  .insert-num{ width:20px; height:20px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0; }
  .slot-row{ display:flex; align-items:center; gap:10px; background:var(--bg-alt); border:1.5px dashed var(--line); border-radius:12px; padding:8px 12px; min-height:42px; }
  .slot-row.filled{ border-style:solid; }
  .slot-row .insert-num{ flex-shrink:0; }
  .slot-name{ font-weight:700; flex:1; }
  .slot-empty{ color:var(--text-dim); font-size:12px; flex:1; }
  .slot-row .insert-btn{ flex:1; width:auto; padding:6px 8px; }
  .current-item-card{ text-align:center; padding:22px; background:var(--bg-alt); border:1.5px solid var(--accent); border-radius:14px; margin-bottom:16px; }
  .guess-points-badge{ text-align:center; font-size:22px; font-weight:800; color:var(--accent-2); margin-bottom:10px; }
  .guess-image-wrap{ display:flex; align-items:center; justify-content:center; background:var(--bg-alt); border:1.5px solid var(--line); border-radius:16px; padding:30px; margin-bottom:14px; min-height:160px; }
  .guess-image{ transition:filter 0.15s linear; }
  .music-player-wrap{ display:flex; align-items:center; justify-content:center; background:var(--bg-alt); border:1.5px solid var(--line); border-radius:16px; padding:30px; margin-bottom:14px; min-height:140px; position:relative; overflow:hidden; }
  .music-overlay{ text-align:center; }
  .music-note-icon{ font-size:48px; animation:musicPulse 1.4s ease-in-out infinite; }
  @keyframes musicPulse{ 0%,100%{ transform:scale(1); opacity:.85; } 50%{ transform:scale(1.12); opacity:1; } }
  .guess-image img{ max-width:100%; max-height:220px; border-radius:10px; display:block; }
  .guess-emoji{ font-size:110px; line-height:1; }
  .guess-attempts-feed{ display:flex; flex-direction:column; gap:6px; margin-top:14px; }
  .current-item-card .name{ font-size:20px; font-weight:800; margin-top:6px; }
  .lives-row{ display:flex; align-items:center; justify-content:space-between; background:var(--bg-alt); border:1px solid var(--line); border-radius:10px; padding:8px 14px; margin-bottom:8px; font-size:13px; }
  .party-waiting{ text-align:center; padding:60px 20px; color:var(--text-dim); }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   BRAIN TEST (ehem. WISSENSDUELL) — Solo & Lokaler Multiplayer (Pass & Play)
   Komplett clientseitig, kein Backend. Fortschritt in localStorage.

// Brain Test: Klassen-basiertes Aufstiegssystem (ersetzt das frühere
// Rang-Test-System für den SOLO-Modus). Eigenes Feld "klasse" (0-basiert,
// 0 = Klasse 1) statt "tier", damit der lokale Pass-&-Play-Mehrspieler
// (nutzt weiterhin RANKS/getRank/score unverändert) davon unberührt bleibt.
const KLASSEN = [
  {name:"Klasse 1", cls:"rank-none"}, {name:"Klasse 2", cls:"rank-listed"},
  {name:"Klasse 3", cls:"rank-bronze"}, {name:"Klasse 4", cls:"rank-silver"},
  {name:"Klasse 5", cls:"rank-gold"}, {name:"Klasse 6", cls:"rank-platin"},
  {name:"Klasse 7", cls:"rank-diamond"}, {name:"Klasse 8", cls:"rank-master"},
  {name:"Klasse 9", cls:"rank-grand"}, {name:"Klasse 10", cls:"rank-grand"}
];
// Testgröße: 20 Fragen in Klasse 1, +5 je Klasse, gedeckelt bei 50 (= Größe
// des Fragenpools je Klasse - mehr als 50 eindeutige Fragen könnten sonst
// nicht gezogen werden). Bestehensgrenze: 80% (aufgerundet).
const KLASSE_TESTS = KLASSEN.map((_, i) => {
  const qCount = Math.min(20 + i * 5, 50);
  return { questions: qCount, needed: Math.ceil(qCount * 0.8) };
});
function klassePillHtml(klasseIndex){
  const k = KLASSEN[Math.min(klasseIndex||0, KLASSEN.length-1)] || KLASSEN[0];
  return `<span class="rank-pill ${k.cls}"><span class="rank-dot"></span>${k.name}</span>`;
}
// Zieht die Testfragen für eine Klasse: aus dem festen 50er-Pool dieser
// Klasse (KLASSE_QUESTIONS) werden zufällig genau so viele gezogen, wie
// KLASSE_TESTS für diese Klasse vorsieht (nie mehr als der Pool hat).
// Ist der Pool einer Klasse noch nicht befüllt (siehe Kommentar bei
// KLASSE_QUESTIONS), wird auf den nächstniedrigeren befüllten Pool
// zurückgefallen, damit das Spiel nicht abbricht, bis alle Klassen fertig
// befüllt sind.
function pickKlasseTestQuestions(klasseIndex){
  let klasseNum = Math.min(klasseIndex, KLASSEN.length-1) + 1;
  while(klasseNum > 1 && !(KLASSE_QUESTIONS[klasseNum] && KLASSE_QUESTIONS[klasseNum].length)) klasseNum--;
  const pool = (KLASSE_QUESTIONS[klasseNum] || []).slice();
  const test = KLASSE_TESTS[Math.min(klasseIndex, KLASSE_TESTS.length-1)];
  for(let i=pool.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]] = [pool[j],pool[i]];
  }
  return pool.slice(0, test.questions);
}

const RANKS = [
  {name:"Nicht gelistet", min:0,     max:999,     cls:"rank-none"},
  {name:"Gelistet",       min:1000,  max:1499,    cls:"rank-listed"},
  {name:"Schüler",        min:1500,  max:2499,    cls:"rank-bronze"},
  {name:"Student",        min:2500,  max:3999,    cls:"rank-silver"},
  {name:"Lehrer",         min:4000,  max:5999,    cls:"rank-gold"},
  {name:"Experte",        min:6000,  max:7999,    cls:"rank-platin"},
  {name:"Wissenschaftler",min:8000,  max:9999,    cls:"rank-diamond"},
  {name:"Professor",      min:10000, max:14999,   cls:"rank-master"},
  {name:"Sheldon",        min:15000, max:Infinity,cls:"rank-grand"}
];
function getRank(score){ return RANKS.find(r => score >= r.min && score <= r.max) || RANKS[0]; }
function getNextRankInfo(score){
  const idx = RANKS.findIndex(r => score >= r.min && score <= r.max);
  if(idx === -1 || idx === RANKS.length - 1) return null;
  const next = RANKS[idx+1];
  return { next, pointsNeeded: next.min - score };
}
function rankPillHtml(score){
  const rank = getRank(score);
  return `<span class="rank-pill ${rank.cls}"><span class="rank-dot"></span>${rank.name}</span>`;
}

/* ------------------------- 3. ZEIT & SCHWIERIGKEIT (zentral) ------------------------- */
// Feste Zeit pro Frage (nicht mehr punktebasiert gestaffelt, da das Punkte-
// system entfernt wurde) - bewusst kurz gehalten, damit auf einem zweiten
// Gerät nicht in Ruhe nachgegoogelt werden kann. Bei Bedarf hier einfach den
// Wert anpassen (z.B. auf 15 senken, falls 30s noch zu lang ist).
function getTimeLimit(){
  return 30;
}
let recentQuestions = [];
// Für den lokalen Pass-&-Play-Mehrspieler (separat vom Solo-Aufstiegssystem):
// 5 Fragen, Schwierigkeit grob am Punkte-Durchschnitt der Teilnehmenden orientiert.
function pickQuestionsForLocalMP(avgScore){
  const weights = avgScore < 1500 ? [0.55,0.30,0.12,0.03]
    : avgScore < 4000 ? [0.30,0.40,0.25,0.05]
    : avgScore < 8000 ? [0.10,0.30,0.40,0.20]
    : [0.03,0.15,0.42,0.40];
  const usedIds = new Set();
  const recentSet = new Set(recentQuestions);
  const picks = [];
  for(let i=0;i<5;i++){
    const r = Math.random();
    const diff = r<weights[0]?1 : r<weights[0]+weights[1]?2 : r<weights[0]+weights[1]+weights[2]?3 : 4;
    let pool = QUESTIONS.map((q,idx)=>({...q,idx})).filter(q=>q.d===diff && !usedIds.has(q.idx) && !recentSet.has(q.idx));
    if(pool.length===0) pool = QUESTIONS.map((q,idx)=>({...q,idx})).filter(q=>q.d===diff && !usedIds.has(q.idx));
    if(pool.length===0) pool = QUESTIONS.map((q,idx)=>({...q,idx})).filter(q=>!usedIds.has(q.idx));
    const chosen = pool[Math.floor(Math.random()*pool.length)];
    usedIds.add(chosen.idx);
    picks.push(chosen);
  }
  recentQuestions = [...picks.map(p=>p.idx), ...recentQuestions].slice(0,40);
  return picks;
}

const PROFILES_KEY = "wissensduell_profiles_v1";
let profiles = [];
function loadProfiles(){
  try{
    const raw = localStorage.getItem(PROFILES_KEY);
    profiles = raw ? JSON.parse(raw) : [];
  }catch(e){ profiles = []; }
}
function saveProfiles(){
  try{ localStorage.setItem(PROFILES_KEY, JSON.stringify(profiles)); }catch(e){}
}
function createProfile(name){
  const p = { id:"p_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    name: name.trim(), score:0, tier:0, klasse:0, consecutiveFails:0, roundsPlayed:0, wins:0, losses:0,
    correctAnswers:0, wrongAnswers:0, bestScore:0 };
  profiles.push(p);
  saveProfiles();
  return p;
}
function applyPoints(profile, delta){
  profile.score = Math.max(0, profile.score + delta);
  profile.bestScore = Math.max(profile.bestScore, profile.score);
  if(profile.isAccount) return; // Account-Profile werden am Rundenende zum Server synchronisiert
  saveProfiles();
}
loadProfiles();

const ACCOUNT_TOKEN_KEY = "wq_account_token";
let account = null; // { token, profile } oder null
let postLoginRedirect = null; // optionale Funktion, die statt renderMainMenu() nach Login/Registrierung aufgerufen wird (z.B. für Arena)

async function apiCall(endpoint, body){
  try{
    const res = await fetch(endpoint, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body||{}) });
    return await res.json();
  }catch(e){
    return { ok:false, error:"Verbindung zum Server fehlgeschlagen." };
  }
}

async function restoreAccountSession(){
  const token = localStorage.getItem(ACCOUNT_TOKEN_KEY);
  if(!token) return;
  const result = await apiCall("/api/session", { token });
  if(result.ok){ account = { token, profile: result.profile }; }
  else { localStorage.removeItem(ACCOUNT_TOKEN_KEY); }
}

function accountIndicatorHtml(){
  if(account){
    return `<div class="account-bar">👤 ${account.profile.username} · <button class="account-link" onclick="logoutAccount()">Abmelden</button></div>`;

  return `<div class="account-bar"><button class="account-link" onclick="renderAccountAuth('login')">Anmelden</button></div>`;
}

async function submitAccountAuth(mode){
  const username = (document.getElementById("authUsername").value || "").trim();
  const password = document.getElementById("authPassword").value || "";
  const errBox = document.getElementById("authError");
  const btn = document.getElementById("authSubmitBtn");
  errBox.classList.add("hidden");
  btn.disabled = true;
  btn.textContent = "…";
  const result = await apiCall(mode==='login' ? "/api/login" : "/api/register", { username, password });
  if(!result.ok){
    errBox.textContent = result.error || "Etwas ist schiefgelaufen.";
    errBox.classList.remove("hidden");
    btn.disabled = false;
    btn.textContent = mode==='login' ? 'ANMELDEN' : 'KONTO ERSTELLEN';
    return;
  }
  account = { token: result.token, profile: result.profile };
  try{ localStorage.setItem(ACCOUNT_TOKEN_KEY, result.token); }catch(e){}
  if(postLoginRedirect){ const fn = postLoginRedirect; postLoginRedirect = null; fn(); }
  else renderMainMenu();
}

async function logoutAccount(){
  if(account) await apiCall("/api/logout", { token: account.token });
  account = null;
  try{ localStorage.removeItem(ACCOUNT_TOKEN_KEY); }catch(e){}
  renderMainMenu();
}

function accountAsProfile(){
  const p = account.profile;
  return {
    id: "account:" + p.username, name: p.username,
    score: p.score, tier: p.tier || 0, klasse: p.klasse || 0, consecutiveFails: p.consecutiveFails || 0, roundsPlayed: p.roundsPlayed, wins: p.wins, losses: p.losses,
    correctAnswers: p.correctAnswers, wrongAnswers: p.wrongAnswers, bestScore: p.bestScore,
    isAccount: true
  };
}

async function syncAccountStats(profile){
  if(!account) return;
  const result = await apiCall("/api/save-stats", {
    token: account.token,
    stats: {
      score: profile.score, tier: profile.tier, klasse: profile.klasse, consecutiveFails: profile.consecutiveFails, roundsPlayed: profile.roundsPlayed, wins: profile.wins, losses: profile.losses,
      correctAnswers: profile.correctAnswers, wrongAnswers: profile.wrongAnswers, bestScore: profile.bestScore
    }
  });
  if(result.ok) account.profile = result.profile;
}

async function beginArenaMatch(){

    party.arenaMode = true;

// Baut den Match-Ablauf sobald der Raum bereit ist: ARENA_BLOCKS_PER_MATCH_CLIENT
// mal (Klassen-Quiz-Block, zufällige Herausforderungsrunde).
function setupArenaRoundPlan(room){
  const league = party.arenaLeague;
  const challengePool = (room.availableRoundDefs || []).slice();
  const roundDefs = [];
  for(let i=0;i<ARENA_BLOCKS_PER_MATCH_CLIENT;i++){
    roundDefs.push({ kind:'arenaQuiz', klasseMin: league.klasseMin, klasseMax: league.klasseMax });
    if(challengePool.length>0){
      const pick = challengePool[Math.floor(Math.random()*challengePool.length)];
      roundDefs.push({ defId: pick.id });
    }
  }
  partySend({action:'setArenaRoundPlan', roundDefs});
  setTimeout(() => partySend({action:'startGame'}), 300);
}

// Wird aus partyHandleMessage() heraus für JEDE Nachricht während eines
// Arena-Matches aufgerufen (siehe dort) - zählt 1 Punkt pro korrekter
// Antwort/gelöster Aufgabe mit, unabhängig vom internen Punktesystem des
// jeweiligen Rundentyps (das hätte oft andere Werte, z.B. 10 statt 1).
function tallyArenaPoints(msg){
  const myId = party.playerId;
  if(msg.type === "roomUpdate" && msg.phase === "lobby" && !party.arenaPlanSet){
    party.arenaPlanSet = true;
    setupArenaRoundPlan(msg);
    return;
  }
  if(msg.type === "quizQuestion"){
    party.arenaBlockLabel = "Quiz";
  }
  if(msg.type === "quizReveal"){
    const mine = (msg.results||[]).find(r => r.playerId === myId);
    if(mine && mine.correct) party.arenaMatchPoints++;
  } else if(msg.type === "orderingFinalReveal"){
    const mine = (msg.results||[]).find(r => r.playerId === myId);
    if(mine) party.arenaMatchPoints += (mine.correctCount||0);
  } else if(msg.type === "rankReveal"){
    party.arenaMatchPoints += ((msg.correctCount||{})[myId] || 0);
  } else if(msg.type === "slfFinalReveal"){
    const mineScores = (msg.scores||{})[myId] || {};
    party.arenaMatchPoints += Object.values(mineScores).filter(v => v > 0).length;
  } else if(msg.type === "nennsBlitzFinal"){
    const mine = (msg.results||[]).find(r => r.playerId === myId);
    if(mine) party.arenaMatchPoints += (mine.total||0);
  }
}

async function finishArenaMatch(){
  const earned = party.arenaMatchPoints || 0;
  renderApp(`<div class="panel"><div class="picker-title">ARENA</div><div class="picker-sub">Match wird ausgewertet …</div></div>`);
  const result = await apiCall("/api/arena-finish-match", { token: account.token, pointsEarned: earned });
  try{ party.ws && party.ws.close(); }catch(e){}
  if(!result.ok){
    alert(result.error || "Auswertung fehlgeschlagen.");
    party = null;
    renderArenaHome();
    return;
  }
  account.profile.arenaPoints = result.totalPoints;
  account.profile.arenaLeague = result.league.index;
  party = null;
  renderApp(`
    <div class="panel">
      <div class="result-title">MATCH BEENDET</div>
      <div class="result-grid" style="margin-top:10px;">
        <div class="result-item pos"><div class="n">+${result.pointsEarned}</div><div class="l">Punkte in diesem Match</div></div>

  `);
}

function statCardHtml(p, extraArena){
  const totalGames = p.wins + p.losses;
  const winRate = totalGames > 0 ? Math.round((p.wins/totalGames)*100) : 0;
  const totalAnswers = p.correctAnswers + p.wrongAnswers;
  const accuracy = totalAnswers > 0 ? Math.round((p.correctAnswers/totalAnswers)*100) : 0;
  return `
    <div class="stat-card">
      <div class="row1">
        <div class="sname">${p.name}${p.isAccount ? ' <span style="font-size:11px; color:var(--text-dim); font-weight:400;">(Konto – gilt für alle Modi)</span>' : ''}</div>

      </div>
      <div class="picker-sub" style="margin:4px 0 8px;">${klassePillHtml(p.klasse||0)} <span style="margin-left:6px;">Aktuelle Klasse (Brain Test)</span></div>
      <div class="stat-mini">
        <div><div class="n">${p.score}</div><div class="l">Punkte</div></div>
        <div><div class="n">${p.bestScore}</div><div class="l">Beste Punktzahl</div></div>
        <div><div class="n">${p.roundsPlayed}</div><div class="l">Runden gespielt</div></div>
        <div><div class="n">${p.wins}</div><div class="l">Siege</div></div>
        <div><div class="n">${p.losses}</div><div class="l">Niederlagen</div></div>
        <div><div class="n">${winRate}%</div><div class="l">Siegquote</div></div>
        <div><div class="n">${p.correctAnswers}/${p.wrongAnswers}</div><div class="l">Richtig/Falsch</div></div>
        <div><div class="n">${accuracy}%</div><div class="l">Trefferquote</div></div>
        ${extraArena ? `
        <div><div class="n">${extraArena.arenaPoints||0}</div><div class="l">Arena-Punkte</div></div>

}

function pickerChoose(id){
  const p = profiles.find(x=>x.id===id);
  if(p && pickerOnPick) pickerOnPick(p);
}
function pickerCreateNew(){
  const input = document.getElementById("newPlayerName");
  const name = (input.value || "").trim();
  if(!name){ input.focus(); return; }
  if(profiles.some(p => p.name.toLowerCase() === name.toLowerCase())){
    alert("Dieser Name existiert bereits. Bitte wähle das Profil aus der Liste oder einen anderen Namen.");
    return;
  }
  const p = createProfile(name);
  if(pickerOnPick) pickerOnPick(p);
}

let solo = null;

// Dünne Weiterleitungen für Rückwärtskompatibilität (bestehende Aufrufstellen
// nutzen noch diese Namen) - die eigentliche Logik steckt generisch in
// startDedicatedMenu() weiter oben.

// Solo-Party (der gemischte gemeinsame Modus) war nur ein internes Test-Tool
// und wird nicht mehr angeboten – "Solo" im Hauptmenü ist jetzt direkt
// Brain Test (startSoloFlow). Diese Funktion bleibt als reine Weiterleitung
// bestehen, damit vorhandene "zurück"-Verweise weiterhin funktionieren.
function startSoloMenu(){
  renderMainMenu();
}

const LAST_PROFILE_KEY = "wq_last_profile_id";
function startSoloFlow(){
  if(account){ beginSolo(accountAsProfile()); return; }
  // Jedes Gerät gehört normalerweise einer Person -> sobald ein lokales
  // Profil existiert, direkt damit starten statt jedes Mal danach zu fragen.
  // Nur wenn noch gar kein Profil da ist, wird die Namenseingabe gezeigt.
  if(profiles.length > 0){
    const lastId = localStorage.getItem(LAST_PROFILE_KEY);
    const profile = profiles.find(p => p.id === lastId) || profiles[0];
    beginSolo(profile);
    return;
  }
  renderProfilePicker("WER SPIELT?", "Wie heißt du?", [], beginSolo, "renderMainMenu");
}

function beginSolo(profile){
  if(!profile.isAccount){ try{ localStorage.setItem(LAST_PROFILE_KEY, profile.id); }catch(e){} }
  const klasseIndex = Math.min(profile.klasse || 0, KLASSE_TESTS.length - 1);
  const test = KLASSE_TESTS[klasseIndex];
  const questions = pickKlasseTestQuestions(klasseIndex);
  const currentKlasse = KLASSEN[klasseIndex] || KLASSEN[0];
  const nextKlasse = KLASSEN[klasseIndex + 1];
  solo = {
    profile,
    startScore: profile.score,
    startTier: klasseIndex,
    questions,
    qIndex: 0,
    timeLimit: getTimeLimit(profile.score),
    testNeeded: test.needed,
    correct: 0, wrong: 0,
    timerId: null, remaining: 0, answered: false
  };

  renderApp(`
    ${statusbarHtml(profile)}
    <div class="panel pass-card">
      <div class="avatar-big" style="background:${avatarColor(profile.name)}">${initials(profile.name)}</div>
      <h2>${profile.name}</h2>
      <p>Aufstiegstest ${currentKlasse.name}${nextKlasse ? ' → '+nextKlasse.name : ''}: ${questions.length} Fragen · mindestens ${test.needed} richtig · ${solo.timeLimit}s pro Frage</p>
      <button class="btn btn-primary" onclick="renderSoloQuestion()">LOS GEHT'S</button>
      <button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="renderMainMenu()">${t('btn_back')}</button>
    </div>
  `);
}

function renderSoloQuestion(){
  const q = solo.questions[solo.qIndex];
  const letters = ["A","B","C","D"];
  solo.answered = false;
  renderApp(`
    ${statusbarHtml(solo.profile)}
    <div class="panel">
      <div class="qmeta">
        <div class="qcount">Frage ${solo.qIndex+1} von ${solo.questions.length}</div>
        <div class="qcat">${q.cat}</div>
      </div>
      <div class="timer-wrap">
        <div class="timer-bar"><div id="timerFill" class="timer-fill" style="width:100%"></div></div>
        <div id="timerNum" class="timer-num">${solo.timeLimit}s</div>
      </div>
      <div class="question-text">${q.q}</div>
      <div class="answers">
        ${q.a.map((ans,i)=>`
          <button class="answer-btn" onclick="handleSoloAnswer(${i})">
            <span class="answer-letter">${letters[i]}</span><span>${ans}</span>
          </button>`).join("")}
      </div>
      <div id="explanationBox" class="explanation hidden"></div>
      <button id="soloNextBtn" class="btn btn-primary btn-block hidden" style="margin-top:14px;" onclick="soloNextQuestion()">WEITER</button>
      <button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="exitSoloTest()">${t('btn_back')}</button>
    </div>
  `);
  startSoloTimer();
}
// Bricht den laufenden Aufstiegstest ab und geht zurück ins Hauptmenü, ohne
// das als bestandenen/nicht bestandenen Versuch gegen das Profil zu werten
// (roundsPlayed/consecutiveFails bleiben unverändert - der Test wurde ja
// nicht zu Ende gespielt).
function exitSoloTest(){
  if(solo){
    clearInterval(solo.timerId);
    solo = null;
  }
  renderMainMenu();
}

function startSoloTimer(){
  solo.remaining = solo.timeLimit;
  updateTimerUI(solo.remaining, solo.timeLimit);
  clearInterval(solo.timerId);
  solo.timerId = setInterval(()=>{
    solo.remaining -= 0.1;
    if(solo.remaining <= 0){
      solo.remaining = 0;
      updateTimerUI(0, solo.timeLimit);
      clearInterval(solo.timerId);
      if(!solo.answered) handleSoloAnswer(null);
    } else {
      updateTimerUI(solo.remaining, solo.timeLimit);
    }
  }, 100);
}
function updateTimerUI(remaining, limit){
  const fill = document.getElementById("timerFill");
  const num = document.getElementById("timerNum");
  if(!fill || !num) return;
  const pct = Math.max(0, (remaining/limit)*100);
  fill.style.width = pct + "%";
  fill.classList.toggle("warn", pct < 30);
  num.textContent = Math.ceil(remaining) + "s";
}

function handleSoloAnswer(selectedIdx){
  if(solo.answered) return;
  solo.answered = true;
  clearInterval(solo.timerId);
  const q = solo.questions[solo.qIndex];
  const isCorrect = selectedIdx === q.c;

  if(isCorrect){ solo.correct++; } else { solo.wrong++; }

  document.querySelectorAll(".answer-btn").forEach((btn,i)=>{
    btn.disabled = true;
    if(i===q.c) btn.classList.add("correct");
    else if(i===selectedIdx) btn.classList.add("wrong");
  });

  const explBox = document.getElementById("explanationBox");
  explBox.classList.remove("hidden");
  explBox.textContent = q.e ? q.e : (isCorrect ? "Richtig beantwortet!" : "Das war leider falsch.");

  // Test vorzeitig entschieden? Bestehen ist bereits sicher (genug richtig)
  // oder unmöglich geworden (selbst mit allen verbleibenden richtig nicht
  // mehr genug) -> keinen Sinn, die restlichen Fragen noch abzufragen.
  const remaining = solo.questions.length - (solo.qIndex + 1);
  const maxPossibleCorrect = solo.correct + remaining;
  solo.decided = (solo.correct >= solo.testNeeded) || (maxPossibleCorrect < solo.testNeeded);

  const nextBtn = document.getElementById("soloNextBtn");
  nextBtn.classList.remove("hidden");
  nextBtn.textContent = solo.decided ? "ZUR RUNDENAUSWERTUNG" : "WEITER";
}
function soloNextQuestion(){
  if(solo.decided){ endSoloRound(); return; }
  solo.qIndex++;
  if(solo.qIndex >= solo.questions.length) endSoloRound();
  else renderSoloQuestion();
}

function endSoloRound(){
  const promoted = solo.correct >= solo.testNeeded;
  if(promoted){
    solo.profile.consecutiveFails = 0;
    if(KLASSEN[solo.startTier + 1]) solo.profile.klasse = solo.startTier + 1;
  } else {
    solo.profile.consecutiveFails = (solo.profile.consecutiveFails || 0) + 1;
    if(solo.profile.consecutiveFails >= 2 && solo.startTier > 0){
      // Zweimal hintereinander an derselben Klasse gescheitert -> eine Klasse zurück.
      solo.profile.klasse = solo.startTier - 1;
      solo.profile.consecutiveFails = 0;
    }
  }

  const roundWon = promoted;
  solo.profile.roundsPlayed++;
  solo.profile.correctAnswers += solo.correct;
  solo.profile.wrongAnswers += solo.wrong;
  if(roundWon) solo.profile.wins++; else solo.profile.losses++;
  if(solo.profile.isAccount) syncAccountStats(solo.profile);
  else saveProfiles();

  const rankBefore = KLASSEN[solo.startTier] || KLASSEN[0];
  const rankAfter = KLASSEN[solo.profile.klasse || 0] || KLASSEN[0];
  const rankChanged = rankBefore.name !== rankAfter.name;
  const nextTest = KLASSE_TESTS[Math.min(solo.profile.klasse || 0, KLASSE_TESTS.length-1)];
  const nextRank = KLASSEN[(solo.profile.klasse || 0) + 1];

  renderApp(`
    ${statusbarHtml(solo.profile)}
    <div class="panel">
      <div class="result-title">RUNDE BEENDET</div>
      <div class="result-sub">${roundWon ? "Starke Leistung!" : "Nächstes Mal klappt's besser."}</div>
      ${rankChanged ? `<div class="rank-up-banner">${promoted ? 'Neuer Rang erreicht: '+rankAfter.name+'!' : 'Zurückgestuft auf: '+rankAfter.name}</div>` : ``}

      <div class="result-grid">
        <div class="result-item pos"><div class="n">${solo.correct}/${solo.questions.length}</div><div class="l">Richtige Antworten (nötig: ${solo.testNeeded})</div></div>
        <div class="result-item neg"><div class="n">${solo.wrong}</div><div class="l">Falsche Antworten</div></div>
        <div class="result-item ${promoted?'pos':''}" style="grid-column: span 2;"><div class="n">${promoted?'✓ Bestanden':'✕ Nicht bestanden'}</div><div class="l">Aufstiegstest${promoted?'':' (nötig: '+solo.testNeeded+'/'+solo.questions.length+')'}${!promoted && solo.profile.consecutiveFails===1 ? ' · noch ein Fehlversuch führt zum Rangabstieg' : ''}</div></div>
      </div>

      <div class="result-item" style="margin-bottom:20px;">
        <div class="n">${klassePillHtml(solo.profile.klasse||0)}</div>
        <div class="l">${nextRank ? `Nächster Aufstiegstest: ${nextTest.questions} Fragen, mindestens ${nextTest.needed} richtig → ${nextRank.name}` : "Höchster Rang erreicht (vorerst)"}</div>
      </div>

      <div class="actions-row">
        <button class="btn btn-primary" onclick="beginSolo(solo.profile)">NOCH EINE RUNDE</button>
        <button class="btn btn-ghost" onclick="renderMainMenu()">HAUPTMENÜ</button>
      </div>
    </div>
  `);
}

/* ============================================================================
   LOKALER MULTIPLAYER (Pass & Play)
   ============================================================================ */
let mp = null;
let mpSetup = { count: 0, chosen: [] };

function startMPFlow(){
  mpSetup = { count: 0, chosen: [] };
  renderApp(`
    <div class="panel">
      <div class="picker-title">LOKALER MULTIPLAYER</div>
      <div class="picker-sub">Wie viele Spieler sitzen an diesem Gerät?</div>
      <div class="count-options">
        <div class="count-btn" onclick="mpSetCount(2)">2<span>Spieler</span></div>
        <div class="count-btn" onclick="mpSetCount(3)">3<span>Spieler</span></div>
        <div class="count-btn" onclick="mpSetCount(4)">4<span>Spieler</span></div>
      </div>
      <div class="actions-row" style="margin-top:18px;">
        <button class="btn btn-ghost" onclick="renderMainMenu()">ZURÜCK</button>
      </div>
    </div>
  `);
}
function mpSetCount(n){
  mpSetup.count = n;
  mpSetup.chosen = [];
  mpPickNextPlayer();
}
function mpPickNextPlayer(){
  const slot = mpSetup.chosen.length;
  if(slot >= mpSetup.count){ beginMP(mpSetup.chosen); return; }
  const excludeIds = mpSetup.chosen.map(p=>p.id);
  const chips = Array.from({length: mpSetup.count}).map((_,i)=>
    `<div class="slot-chip ${i<slot?'filled':''}">${i<slot ? mpSetup.chosen[i].name : 'Spieler '+(i+1)}</div>`
  ).join("");
  renderProfilePicker(
    `SPIELER ${slot+1} VON ${mpSetup.count}`,
    "Profil auswählen oder einen neuen Spieler anlegen.",
    excludeIds,
    (p) => { mpSetup.chosen.push(p); mpPickNextPlayer(); },
    "startMPFlow"
  );
  const list = document.querySelector(".picker-list");
  if(list) list.insertAdjacentHTML("beforebegin", `<div class="slot-progress">${chips}</div>`);
}

function beginMP(playerProfiles){
  const avgScore = Math.round(playerProfiles.reduce((s,p)=>s+p.score,0) / playerProfiles.length);
  mp = {
    players: playerProfiles.map(p => ({
      profile: p, startScore: p.score,
      roundCorrect:0, roundWrong:0, roundPoints:0
    })),
    questions: pickQuestionsForLocalMP(avgScore),
    qIndex: 0,
    turnIndex: 0,
    currentResults: [], // {correct:bool} pro Spieler für aktuelle Frage
    timerId: null, remaining: 0, timeLimit: 0, answered:false
  };
  renderMPPassScreen();
}

function renderMPPassScreen(){
  const player = mp.players[mp.turnIndex].profile;
  const q = mp.questions[mp.qIndex];
  renderApp(`
    <div class="panel pass-card">
      <div class="avatar-big" style="background:${avatarColor(player.name)}">${initials(player.name)}</div>
      <h2>${player.name.toUpperCase()} IST DRAN</h2>
      <p>Frage ${mp.qIndex+1} von 5 · Gib das Gerät weiter, damit nur ${player.name} die Frage sieht.</p>
      <button class="btn btn-primary" onclick="renderMPQuestion()">BEREIT – FRAGE ANZEIGEN</button>
    </div>
  `);
}

function renderMPQuestion(){
  const playerEntry = mp.players[mp.turnIndex];
  const q = mp.questions[mp.qIndex];
  const letters = ["A","B","C","D"];
  mp.timeLimit = getTimeLimit(playerEntry.profile.score);
  mp.answered = false;

  renderApp(`
    ${statusbarHtml(playerEntry.profile)}
    <div class="panel">
      <div class="qmeta">
        <div class="qcount">${playerEntry.profile.name} · Frage ${mp.qIndex+1} von 5</div>
        <div class="qcat">${q.cat}</div>
      </div>
      <div class="timer-wrap">
        <div class="timer-bar"><div id="timerFill" class="timer-fill" style="width:100%"></div></div>
        <div id="timerNum" class="timer-num">${mp.timeLimit}s</div>
      </div>
      <div class="question-text">${q.q}</div>
      <div class="answers">
        ${q.a.map((ans,i)=>`
          <button class="answer-btn" onclick="handleMPAnswer(${i})">
            <span class="answer-letter">${letters[i]}</span><span>${ans}</span>
          </button>`).join("")}
      </div>
    </div>
  `);
  startMPTimer();
}

function startMPTimer(){
  mp.remaining = mp.timeLimit;
  updateTimerUI(mp.remaining, mp.timeLimit);
  clearInterval(mp.timerId);
  mp.timerId = setInterval(()=>{
    mp.remaining -= 0.1;
    if(mp.remaining <= 0){
      mp.remaining = 0;
      updateTimerUI(0, mp.timeLimit);
      clearInterval(mp.timerId);
      if(!mp.answered) handleMPAnswer(null);
    } else {
      updateTimerUI(mp.remaining, mp.timeLimit);
    }
  }, 100);
}

function handleMPAnswer(selectedIdx){
  if(mp.answered) return;
  mp.answered = true;
  clearInterval(mp.timerId);

  const playerEntry = mp.players[mp.turnIndex];
  const q = mp.questions[mp.qIndex];
  const isCorrect = selectedIdx === q.c;
  const delta = isCorrect ? 100 : -150;

  if(isCorrect){ playerEntry.roundCorrect++; } else { playerEntry.roundWrong++; }
  playerEntry.roundPoints += delta;
  applyPoints(playerEntry.profile, delta);
  mp.currentResults.push({ name: playerEntry.profile.name, correct: isCorrect });

  renderApp(`
    <div class="panel confirm-card">
      <div class="points-badge ${isCorrect?'pos':'neg'}">${isCorrect?'+100':'-150'}</div>
      <p style="color:var(--text-dim); margin-top:10px;">Antwort von ${playerEntry.profile.name} gespeichert.</p>
    </div>
  `);

  setTimeout(()=>{
    mp.turnIndex++;
    if(mp.turnIndex >= mp.players.length){
      renderMPResolve();
    } else {
      renderMPPassScreen();
    }
  }, 1300);
}

function renderMPResolve(){
  const q = mp.questions[mp.qIndex];
  renderApp(`
    <div class="panel">
      <div class="picker-title">AUFLÖSUNG</div>
      <div class="picker-sub">Richtige Antwort: ${q.a[q.c]}</div>
      <div class="resolve-list">
        ${mp.currentResults.map(r => `
          <div class="resolve-row">
            <span>${r.name}</span>
            <span class="mark ${r.correct?'ok':'bad'}">${r.correct?'✓':'✕'}</span>
          </div>
        `).join("")}
      </div>
      ${q.e ? `<div class="explanation">${q.e}</div>` : ``}
      <div class="actions-row" style="margin-top:18px;">
        <button class="btn btn-primary" onclick="mpNextQuestion()">${mp.qIndex+1 >= mp.questions.length ? 'ZUR RUNDENAUSWERTUNG' : 'NÄCHSTE FRAGE'}</button>
      </div>
    </div>
  `);
}

function mpNextQuestion(){
  mp.qIndex++;
  mp.turnIndex = 0;
  mp.currentResults = [];
  if(mp.qIndex >= mp.questions.length){
    endMPRound();
  } else {
    renderMPPassScreen();
  }
}

function endMPRound(){
  const maxPoints = Math.max(...mp.players.map(p=>p.roundPoints));
  const bonus = 150;
  mp.players.forEach(p => {
    p.isWinner = p.roundPoints === maxPoints;
    if(p.isWinner) applyPoints(p.profile, bonus);
    p.profile.roundsPlayed++;
    p.profile.correctAnswers += p.roundCorrect;
    p.profile.wrongAnswers += p.roundWrong;
    if(p.isWinner) p.profile.wins++; else p.profile.losses++;
  });
  saveProfiles();

  const ranked = [...mp.players].sort((a,b)=> (b.roundPoints + (b.isWinner?bonus:0)) - (a.roundPoints + (a.isWinner?bonus:0)));
  const medals = ["🥇","🥈","🥉","4."];

  renderApp(`
    <div class="panel">
      <div class="result-title">RUNDE BEENDET</div>
      <div class="result-sub">Ergebnis nach 5 Fragen</div>
      ${ranked.map((p,i) => {
        const rankBefore = getRank(p.startScore);
        const rankAfter = getRank(p.profile.score);
        const changed = rankBefore.name !== rankAfter.name;
        const total = p.roundPoints + (p.isWinner ? bonus : 0);
        return `
          <div class="leaderboard-row">
            <div class="medal">${medals[i]}</div>
            <div class="avatar-circle" style="background:${avatarColor(p.profile.name)}">${initials(p.profile.name)}</div>
            <div>
              <div class="lname">${p.profile.name} ${p.isWinner ? '👑' : ''}</div>
              <div class="lsub">${p.roundCorrect} richtig · ${p.roundWrong} falsch ${changed ? '· <b style="color:var(--accent-2)">NEU: '+rankAfter.name+'</b>' : ''}</div>
            </div>
            <div class="lright">
              <div class="lpoints">${total>=0?'+':''}${total}</div>
              <div class="lsub">${p.profile.score} Pkt gesamt</div>
            </div>
          </div>`;
      }).join("")}
      <div class="actions-row" style="margin-top:14px;">
        <button class="btn btn-primary" onclick="beginMP(mp.players.map(p=>p.profile))">NOCH EINE RUNDE</button>
        <button class="btn btn-ghost" onclick="renderMainMenu()">HAUPTMENÜ</button>
      </div>
    </div>
  `);
}

/* ============================================================================
   PARTY (WLAN) — echte Vernetzung über den mitgelieferten Node-Server
   ============================================================================ */
let party = null; // {ws, playerId, roomCode, isHost, room, myAnswered}

function wsUrl(){
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  return proto + "//" + location.host;
}

let pendingCreateGameMode = "mixed";
function startPartyFlow(gameMode){
  pendingCreateGameMode = dedicatedGameMode(gameMode);
  const backTarget = dedicatedBackFn(pendingCreateGameMode);
  if(location.protocol !== "http:" && location.protocol !== "https:"){
    renderApp(`
      <div class="panel">
        <div class="picker-title">PARTY RAUM</div>
        <div class="explanation" style="border-color:var(--danger); color:var(--text);">
          Diese Seite wurde direkt als Datei geöffnet (Adresse beginnt nicht mit <code>http://</code>
          oder <code>https://</code>, sondern z.B. mit <code>file://</code> oder <code>content://</code>).
          Der Party-Modus braucht aber den mitgelieferten Server: Er muss auf einem Computer im
          selben WLAN mit <code>node server.js</code> gestartet werden. Öffne anschließend auf
          <b>diesem</b> Gerät die Adresse, die die Server-Konsole anzeigt
          (z.B. <code>http://192.168.1.23:3000</code>) – nicht die Datei selbst.
        </div>
        <div class="actions-row" style="margin-top:18px;">
          <button class="btn btn-ghost" onclick="${backTarget}">ZURÜCK</button>
        </div>
      </div>
    `);
    return;
  }
  renderApp(`
    <div class="panel">
      <div class="picker-title">${pendingCreateGameMode==='slf' ? 'STADT LAND FLUSS – MULTIPLAYER' : (pendingCreateGameMode==='music' ? 'MUSIK RATEN – MULTIPLAYER' : (pendingCreateGameMode==='blitz' ? 'NENN\'S BLITZ – MULTIPLAYER' : t('party_entry_title')))}</div>
      <div class="picker-sub">${t('party_entry_sub')}</div>
      <div class="picker-form" style="margin-bottom:14px;">
        <input id="partyName" type="text" placeholder="${t('party_name_placeholder')}" maxlength="20" value="${account ? account.profile.username : ''}">
      </div>
      <div id="partyEntryError" class="explanation hidden" style="border-color:var(--danger);"></div>
      <div class="actions-row" style="margin-bottom:18px;">
        <button id="partyCreateBtn" class="btn btn-primary" onclick="partyCreateRoom()">${t('party_create_room')}</button>
      </div>
      <div class="picker-sub">${t('party_join_existing')}</div>
      <div class="picker-form">
        <input id="partyCode" type="text" placeholder="${t('party_code_placeholder')}" maxlength="4" style="text-transform:uppercase;">
        <button id="partyJoinBtn" class="btn btn-primary" onclick="partyJoinRoom()">${t('party_join')}</button>
      </div>
      <div class="actions-row" style="margin-top:18px;">
        <button class="btn btn-ghost" onclick="${backTarget}">${t('btn_back')}</button>
      </div>
    </div>
  `);
}

function partyGetName(){
  const el = document.getElementById("partyName");
  const name = (el && el.value || "").trim();
  return name || "Spieler";
}

function partyShowEntryError(message){
  ["partyCreateBtn","partyJoinBtn"].forEach(id=>{
    const btn = document.getElementById(id);
    if(btn){ btn.disabled = false; btn.textContent = id==="partyCreateBtn" ? "RAUM ERSTELLEN" : "BEITRETEN"; }
  });
  const box = document.getElementById("partyEntryError");
  if(box){ box.classList.remove("hidden"); box.textContent = message; }
  else { alert(message); }
}

function partyConnect(onOpen, onFail){
  let ws;
  try{
    ws = new WebSocket(wsUrl());
  }catch(err){
    onFail("Verbindung zum Server konnte nicht aufgebaut werden (" + err.message + "). Läuft der Server (node server.js) und ist diese Seite über seine http-Adresse geöffnet?");
    return;
  }
  party = { ws, playerId:null, roomCode:null, isHost:false, room:null, myAnswered:false, myRankAnswered:false, selectedRankItemId:null, lastRankMsg:null };

  const timeout = setTimeout(() => {
    if(ws.readyState !== WebSocket.OPEN){
      ws.close();
      party = null;
      onFail("Der Server antwortet nicht. Prüfe, ob 'node server.js' läuft und ob dieses Gerät im selben WLAN ist.");
    }
  }, 5000);

  ws.onopen = () => { clearTimeout(timeout); onOpen(); };
  ws.onmessage = (ev) => partyHandleMessage(JSON.parse(ev.data));
  ws.onclose = () => {
    clearTimeout(timeout);
    const hadSession = party && party.roomCode;
    const wasSolo = party && party.soloMode;
    party = null;
    if(hadSession) renderPartyDisconnected(wasSolo);
  };
  ws.onerror = () => {
    clearTimeout(timeout);
    onFail("Verbindung zum Server fehlgeschlagen. Prüfe, ob 'node server.js' läuft und ob dieses Gerät im selben WLAN wie der Host ist.");
  };
}

function renderPartyDisconnected(wasSolo){
  renderApp(`
    <div class="panel party-waiting">
      <h2 style="color:var(--text); margin-bottom:8px;">Verbindung verloren</h2>
      <p>Die Verbindung zum ${wasSolo ? 'Server' : 'Party-Server'} wurde unterbrochen.</p>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="${wasSolo ? 'renderMainMenu()' : 'startPartyFlow()'}">${wasSolo ? 'ZURÜCK ZUM MENÜ' : 'ZURÜCK ZUR PARTY-AUSWAHL'}</button>
    </div>
  `);
}
function renderPartyKicked(){
  renderApp(`
    <div class="panel party-waiting">
      <h2 style="color:var(--text); margin-bottom:8px;">Aus dem Raum entfernt</h2>
      <p>Der Host hat dich aus dem Warteraum entfernt.</p>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="renderMainMenu()">ZUM HAUPTMENÜ</button>
    </div>
  `);
}

function partyCreateRoom(){
  const name = partyGetName();
  const btn = document.getElementById("partyCreateBtn");
  if(btn){ btn.disabled = true; btn.textContent = "VERBINDE …"; }
  const box = document.getElementById("partyEntryError");
  if(box) box.classList.add("hidden");
  partyConnect(
    () => { party.gameMode = pendingCreateGameMode; party.ws.send(JSON.stringify({ action:"createRoom", name, language: currentLang, gameMode: pendingCreateGameMode })); },

  );
}
function partyJoinRoom(){
  const name = partyGetName();
  const code = (document.getElementById("partyCode").value || "").trim().toUpperCase();
  if(!code) return;
  const btn = document.getElementById("partyJoinBtn");
  if(btn){ btn.disabled = true; btn.textContent = "VERBINDE …"; }

  if(box) box.classList.add("hidden");
  partyConnect(
    () => party.ws.send(JSON.stringify({ action:"joinRoom", code, name })),
    (msg) => partyShowEntryError(msg)
  );
}
function partySend(msg){ if(party && party.ws) party.ws.send(JSON.stringify(msg)); }
function partyLeave(){ if(party && party.ws) party.ws.close(); party = null; renderMainMenu(); }
function restartSoloParty(){ const gm = party && party.gameMode; if(party && party.ws) party.ws.close(); party = null; connectSoloPartyToPicker(gm, lastSoloPartyName); }
function partySetLanguage(lang){ currentLang = lang; try{ localStorage.setItem("wq_lang", lang); }catch(e){} partySend({action:'setLanguage', language: lang}); }

/* ---------- Solo-Party (Party-Engine allein gespielt, ohne Lobby/Bots) ---------- */
// Genau wie beim klassischen Wissenstest: kurz den Namen bestätigen, dann
// eine Kategorie wählen (oder zufällig) – kein Konfigurationsbildschirm mit
// Sprache/Rundenzahl/Rundenmodus/Rundenbau mehr. Es ist immer genau EINE
// Runde (der klassische Wissenstest bleibt mit seinen 5 Fragen unverändert,
// das betrifft nur Stadt Land Fluss / Musik raten / den gemischten Modus).
let lastSoloPartyName = "Du";
function startSoloPartyFlow(gameMode){
  const gm = dedicatedGameMode(gameMode);
  // Eingeloggt -> direkt mit dem Konto-Namen starten, keine erneute
  // Namenseingabe nötig (ein Profil für alle Modi, wie gewünscht).
  if(account){ connectSoloPartyToPicker(gm, account.profile.username); return; }
  const title = dedicatedScreenTitle(gm) ? dedicatedScreenTitle(gm) + ' – SOLO' : t('solo_party_title');
  const backFn = dedicatedBackFn(gm);
  renderApp(`
    <div class="panel pass-card">
      <div class="avatar-big" style="background:${avatarColor(lastSoloPartyName)}">${initials(lastSoloPartyName)}</div>
      <div class="picker-title" style="margin-top:10px;">${title}</div>
      <p>Wie heißt du?</p>
      <div class="picker-form">
        <input id="soloPartyName" type="text" placeholder="Dein Name" maxlength="20" value="${lastSoloPartyName}" onkeydown="if(event.key==='Enter')confirmSoloPartyName('${gm}')">
      </div>
      <button class="btn btn-primary" style="margin-top:14px;" onclick="confirmSoloPartyName('${gm}')">WEITER</button>
      <button class="btn btn-ghost" style="margin-top:8px;" onclick="${backFn}()">${t('btn_back')}</button>
    </div>
  `);
}
function confirmSoloPartyName(gm){
  const input = document.getElementById("soloPartyName");
  const name = ((input && input.value) || "Du").trim().slice(0,20) || "Du";
  connectSoloPartyToPicker(gm, name);
}
function connectSoloPartyToPicker(gameMode, name){
  const gm = dedicatedGameMode(gameMode);
  lastSoloPartyName = name || "Du";
  partyConnect(
    () => {
      party.soloMode = true;
      party.gameMode = gm;
      party.soloPickerDone = false; // steuert im roomUpdate-Handler die Kategorie-Auswahl
      party.ws.send(JSON.stringify({ action:"createRoom", name: lastSoloPartyName, language: currentLang, gameMode: gm }));
    },
    (msg) => {
      const title = dedicatedScreenTitle(gm) ? dedicatedScreenTitle(gm) + ' – SOLO' : t('solo_party_title');
      const backFn = dedicatedBackFn(gm);
      renderApp(`
        <div class="panel">
          <div class="picker-title">${title}</div>
          <div class="explanation" style="border-color:var(--danger); color:var(--text);">${msg}</div>
          <div class="actions-row" style="margin-top:18px;">
            <button class="btn btn-ghost" onclick="${backFn}()">${t('btn_back')}</button>
          </div>
        </div>
      `);
    }
  );
}
// Auswahl für die eine Solo-Runde: zufällig, oder eine bestimmte Kategorie
// aus dem für diesen gameMode verfügbaren Pool (bei Stadt Land Fluss/Musik
// raten also nur deren eigene Kategorien, beim gemischten Modus alle).

function chooseNennsBlitzDuration(ms){
  partySend({action:'setNennsBlitzDuration', durationMs: ms});
}
function chooseSoloCategory(defId){
  party.soloPickerDone = true; // weitere roomUpdates waehrend des Startvorgangs nicht mehr als Auswahlbildschirm zeigen
  // Rundenzahl wurde bereits über die Chips oben eingestellt (party.room.roundCount) –
  // hier nur noch die Kategorie(n) für genau diese Rundenzahl festlegen.
  const count = party.room.roundCount || 5;
  if(defId){
    partySend({action:'setRoundMode', mode:'custom'});
    for(let i=0;i<count;i++) partySend({action:'setRoundDef', index:i, defId});
  } else {
    partySend({action:'setRoundMode', mode:'random'});
  }
  partySend({action:'startGame'});
}

  // Runde mit gezielter Kategorie-Wahl (Zufällig oder Eigene Runde direkt
  // darunter) mehr Sinn als im normal gemischten Modus.
  const counts = room.gameMode && room.gameMode !== 'mixed' ? [1,5,10,15,20] : [5,10,15,20];

function roundPlanReady(room){
  return room.roundMode !== 'custom' || (room.roundDefs.length === room.roundCount && room.roundDefs.every(Boolean));
}



function partyHandleMessage(msg){
  if(!party) return;
  if(party.arenaMode){
    if(msg.type === "gameEnd"){ finishArenaMatch(); return; }
    tallyArenaPoints(msg);
  }
  switch(msg.type){
    case "joined":
      party.playerId = msg.playerId;
      party.roomCode = msg.roomCode;
      party.isHost = msg.isHost;
      break;
    case "error":
      alert(msg.message);
      break;
    case "kicked":
      if(party && party.ws) party.ws.close();
      renderPartyKicked();
      party = null;
      break;
    case "roomUpdate":
      party.room = msg;
      if(msg.phase === "lobby"){
        if(party.soloMode){
          // Zwischen-roomUpdates während des Startvorgangs (setRoundCount/
          // setRoundMode/setRoundDef, ausgelöst von chooseSoloCategory)
          // ignorieren, sobald die Auswahl einmal getroffen wurde – sonst
          // würde kurz wieder der Auswahlbildschirm aufblitzen.
          if(!party.soloPickerDone) renderSoloCategoryPicker();
        } else {
          renderPartyLobby();
        }
      }
      break;
    case "roundStart":
      party.myAnswered = false;
      party.selectedRankItemId = null;
      if(party.soloMode && msg.kind === "knowledgeQuiz") party.soloQuizLives = 3;
      else party.soloQuizLives = undefined;
      renderPartyRoundIntro(msg);
      break;
    case "quizQuestion":
      party.myAnswered = false;
      renderPartyQuiz(msg);
      break;
    case "quizReveal":
      if(party.soloMode && typeof party.soloQuizLives === "number"){
        const mine = msg.results.find(r => r.playerId === party.playerId);
        if(mine && !mine.correct){
          party.soloQuizLives--;
          if(party.soloQuizLives <= 0){
            if(party.ws) party.ws.close(); // sofort trennen, damit keine weitere Frage mehr nachkommt
            renderSoloQuizGameOver(msg);
            party = null; // verhindert, dass das spätere close-Event den Bildschirm überschreibt
            break;
          }
        }
      }
      renderPartyQuizReveal(msg);
      break;
    case "rankState":
      renderPartyRank(msg);
      break;
    case "rankAttempt":
      renderPartyRankAttempt(msg);
      break;
    case "rankReveal":
      renderPartyRankReveal(msg);
      break;
    case "orderingState":
      renderPartyOrdering(msg);
      break;
    case "orderingHurry":
      handleOrderingHurry(msg);
      break;
    case "orderingFinalReveal":
      renderPartyOrderingFinal(msg);
      break;
    case "guessItem":
      party.guessAttempts = [];
      renderPartyGuessItem(msg);
      break;
    case "guessAttempt":
      handlePartyGuessAttempt(msg);
      break;
    case "guessResolved":
      renderPartyGuessResolved(msg);
      break;
    case "musicItem":
      renderPartyMusicItem(msg);
      break;
    case "musicReplayGranted":
      handleMusicReplayGranted(msg);
      break;
    case "musicPlayerSubmitted":
      handlePartyMusicSubmitted(msg);
      break;
    case "musicResolved":
      renderPartyMusicResolved(msg);
      break;
    case "slfRoundStart":
      party.slfSubmitted = false;
      renderSlfAnswering(msg);
      break;
    case "slfHurryUp":
      handleSlfHurryUp(msg);
      break;
    case "slfReveal":
      renderSlfReveal(msg);
      break;
    case "slfChallengeUpdate":
      party.slfChallenges = msg.challenges;
      party.slfReadyCount = msg.readyCount;
      party.slfReadyTotal = msg.readyTotal;
      updateSlfChallengeUI();
      break;
    case "slfFinalReveal":
      renderSlfFinal(msg);
      break;
    case "nennsBlitzStart":
      renderNennsBlitzAnswering(msg);
      break;
    case "nennsBlitzOwnUpdate":
      handleNennsBlitzOwnUpdate(msg);
      break;
    case "nennsBlitzReveal":
      renderNennsBlitzReveal(msg);
      break;
    case "nennsBlitzChallengeUpdate":
      party.nennsBlitzChallenges = msg.challenges;
      party.nennsBlitzReadyCount = msg.readyCount;
      party.nennsBlitzReadyTotal = msg.readyTotal;
      updateNennsBlitzChallengeUI();
      break;
    case "nennsBlitzFinal":
      renderNennsBlitzFinal(msg);
      break;
    case "roundEnd":
      renderPartyRoundEnd(msg);
      break;
    case "gameEnd":
      renderPartyGameEnd(msg);
      break;
  }
}

/* ---------- Eigene Spielrunde zusammenstellen (Round-Builder) ---------- */
const PARTY_MODE_META = {
  knowledgeQuiz: "Wissenstest",
  orderingGame: "Einordnen",
  chronologyGame: "Chronologie",
  higherLowerGame: "Mehr oder Weniger",
  guessPicture: "Bild erraten",
  stadtLandFluss: "Stadt Land Fluss"
};
const SLF_SUGGESTED_CATEGORIES = ["Stadt","Land","Fluss","Name","Tier","Beruf","Pflanze","Farbe","Automarke","Filmtitel","Promi","Getränk","Sportart"];
function builderCategoryLabel(def){
  const idx = def.label.indexOf(": ");
  return idx === -1 ? def.label : def.label.slice(idx + 2);
}
function builderModes(){
  const kinds = [...new Set(party.room.availableRoundDefs.map(d => d.kind))];
  return kinds.map(k => ({ kind: k, label: PARTY_MODE_META[k] || k }));
}

function openRoundBuilder(returnTo){
  const room = party.room;
  party.roundBuilder = {
    returnTo,
    targetCount: room.roundCount,
    rounds: room.roundDefs.filter(Boolean).map(r => ({ id: r.id, kind: r.kind, label: r.label, categories: r.categories })),
    modeSearch: "",
    selectedKind: null,
    categorySearch: "",
    selectedDefId: null,
    slfMode: null,
    slfCategories: [],
    editingIndex: null
  };
  renderRoundBuilder();
}

function renderRoundBuilder(){
  const b = party.roundBuilder;
  const room = party.room;
  const modeQuery = (b.modeSearch || "").toLowerCase();
  const modes = builderModes().filter(m => m.label.toLowerCase().includes(modeQuery));

  const isSlf = b.selectedKind === "stadtLandFluss";
  const needsCategory = b.selectedKind && b.selectedKind !== "knowledgeQuiz" && !isSlf;
  const catQuery = (b.categorySearch || "").toLowerCase();
  const categories = needsCategory
    ? room.availableRoundDefs.filter(d => d.kind === b.selectedKind && builderCategoryLabel(d).toLowerCase().includes(catQuery))
    : [];

  const slfReady = isSlf && (b.selectedDefId === "slf_original" || b.selectedDefId === "slf_party" || (b.slfMode === "custom" && b.slfCategories.length > 0));
  const atCapacity = b.editingIndex === null && b.rounds.length >= b.targetCount;
  const missingCategory = (needsCategory && !b.selectedDefId) || (isSlf && !slfReady);
  const addDisabled = !b.selectedKind || missingCategory || atCapacity;

  renderApp(`
    <div class="panel">
      <div class="picker-title">EIGENE SPIELRUNDE${b.editingIndex !== null ? ' – Runde bearbeiten' : ''}</div>
      <div class="picker-sub">${b.rounds.length} / ${b.targetCount} Runden ausgewählt</div>

      <div class="settings-row" style="display:block; border-bottom:none; padding-bottom:6px;">
        <span class="label">🔍 Spielmodus suchen</span>

          ${modes.length ? modes.map(m => `<div class="chip-btn ${b.selectedKind===m.kind?'active':''}" onclick="builderSelectMode('${m.kind}')">${m.label}</div>`).join("")

        <div class="settings-row" style="display:block; border-bottom:none; margin-top:12px; padding-bottom:6px;">
          <span class="label">🔍 Kategorie suchen</span>
          <input type="text" class="builder-search" placeholder="z.B. Gebäude" value="${b.categorySearch}" oninput="builderSetCategorySearch(this.value)">
          <div class="builder-category-list">
            ${categories.length ? categories.map(d => `<div class="builder-category-item ${b.selectedDefId===d.id?'active':''}" onclick="builderSelectCategory('${d.id}')">${builderCategoryLabel(d)}</div>`).join("")
              : `<span style="color:var(--text-dim); font-size:13px;">Keine Kategorie gefunden</span>`}
          </div>
        </div>
      ` : ``}

      ${isSlf ? `
        <div class="settings-row" style="display:block; border-bottom:none; margin-top:12px; padding-bottom:6px;">
          <span class="label">Kategorien-Auswahl</span>
          <div class="chip-group" style="margin-top:8px;">
            <div class="chip-btn ${b.selectedDefId==='slf_original'?'active':''}" onclick="builderSlfChooseOriginal()">🎲 Original (${SLF_DEFAULT_CATEGORIES_CLIENT.join(', ')})</div>
            <div class="chip-btn ${b.selectedDefId==='slf_party'?'active':''}" onclick="builderSlfChoosePartyMix()">🎉 Party-Mix (10 zufällige Kategorien)</div>
            <div class="chip-btn ${b.slfMode==='custom'?'active':''}" onclick="builderSlfChooseCustom()">✏️ Eigene Kategorien</div>
          </div>
          ${b.slfMode === 'custom' ? `
            <div style="margin-top:12px;">
              <div class="chip-group">
                ${SLF_SUGGESTED_CATEGORIES.map(cat => `<div class="chip-btn ${b.slfCategories.includes(cat)?'active':''}" onclick="builderSlfToggleCategory('${cat}')">${cat}</div>`).join("")}
              </div>

            </div>

  } else {

    if(!def) return;
    entry = { id: def.id, kind: def.kind, label: def.label };
  }
  if(b.editingIndex !== null){

    b.editingIndex = null;

    b.rounds.push(entry);

function startOrderingTicker(msg){
  if(party.orderingTickerId) clearInterval(party.orderingTickerId);
  const startedAt = Date.now();
  const totalMs = Math.max(1, msg.remainingMs);
  party.orderingTickerId = setInterval(() => {
    const elapsed = Date.now() - startedAt;
    const remaining = Math.max(0, totalMs - elapsed);
    const fill = document.getElementById("orderingTimerFill");
    const num = document.getElementById("orderingTimerNum");
    if(fill){ fill.style.width = Math.max(0,(remaining/totalMs)*100) + "%"; fill.classList.toggle("warn", remaining < totalMs*0.2); }
    if(num) num.textContent = Math.ceil(remaining/1000) + "s";
    if(remaining <= 0) clearInterval(party.orderingTickerId);
  }, 150);
}

function startGuessTicker(msg){
  if(party.guessTickerId) clearInterval(party.guessTickerId);
  const badge = document.getElementById("guessPointsBadge");
  const fill = document.getElementById("guessTimerFill");
  const img = document.getElementById("guessImage");
  // Lokalen Startzeitpunkt beim Empfang auf DIESEM Gerät nehmen (wie bei
  // Musik raten/Stadt Land Fluss/Nenn's Blitz), NICHT den absoluten
  // msg.startedAt vom Server vergleichen - sonst verschiebt sich der
  // Countdown/die Unschärfe bei nicht exakt synchroner Geräteuhr (Bug: bei
  // zwei verschiedenen Handys blieb es bei einem der beiden stehen).
  const startedAt = Date.now();
  party.guessTickerId = setInterval(() => {
    const elapsed = Date.now() - startedAt;
    const remaining = Math.max(0, msg.durationMs - elapsed);
    if(fill) fill.style.width = Math.max(0, (remaining / msg.durationMs) * 100) + "%";
    if(fill) fill.classList.toggle("warn", remaining < msg.durationMs * 0.25);
    const tierIdx = Math.min(Math.floor(elapsed / msg.tierMs), msg.tiers.length - 1);
    const points = msg.tiers[Math.max(0, tierIdx)];
    if(badge) badge.textContent = points + " Punkte";
    if(img){
      // Von stark unscharf (Stufe 0) zu klar (letzte Stufe) übergehen
      const blurLevels = [18, 10, 5, 0];
      const blur = blurLevels[Math.min(tierIdx, blurLevels.length-1)];
      img.style.filter = `blur(${blur}px)`;
    }
    if(remaining <= 0) clearInterval(party.guessTickerId);
  }, 100);
}

function submitPartyGuess(){
  if(party.guessAnswered) return;
  const input = document.getElementById("guessInput");
  const text = (input && input.value || "").trim();
  if(!text) return;
  partySend({action:'guessSubmit', text});
  if(input){ input.value = ""; input.focus(); }
}

function handlePartyGuessAttempt(msg){
  if(!party.guessAttempts) party.guessAttempts = [];
  party.guessAttempts.unshift(msg);
  party.guessAttempts = party.guessAttempts.slice(0, 5);
  const feed = document.getElementById("guessAttemptsFeed");
  if(feed){
    feed.innerHTML = party.guessAttempts.map(a => `

        <span class="mark ${a.correct?'ok':'bad'}">${a.correct?'✓':'✕'}</span>

/* ---------- Musik raten (YouTube IFrame API) ---------- */
// Wird einmalig geladen; mehrere Songs in Folge nutzen denselben Player neu.
let ytApiReady = false;
let ytApiLoadingPromise = null;
function loadYouTubeApi(){
  if(ytApiReady && window.YT && window.YT.Player) return Promise.resolve();
  if(ytApiLoadingPromise) return ytApiLoadingPromise;
  ytApiLoadingPromise = new Promise((resolve) => {
    if(window.YT && window.YT.Player){ ytApiReady = true; resolve(); return; }
    const prevCallback = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { ytApiReady = true; if(prevCallback) prevCallback(); resolve(); };
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  });
  return ytApiLoadingPromise;
}
