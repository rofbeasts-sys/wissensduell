<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Chess Original – Brain Pulse</title>
<style>
  :root{ --bg:#0a0d16; --bg-alt:#10141f; --panel:#151b2b; --panel-2:#1c2338; --line:#262e46;
    --text:#eef0fb; --text-dim:#9aa3c0; --accent:#c6ff3d; --accent-2:#3de0ff; --bad:#ff5d8f;
    --sq-light:#eeeed2; --sq-dark:#769656; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body{ min-height:100vh; background:radial-gradient(1200px 600px at 50% -10%, #17203a 0%, var(--bg) 60%); }
  .wrap{ max-width:480px; margin:0 auto; padding:14px 16px 40px; }
  .top{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .back{ color:var(--accent); text-decoration:none; font-size:20px; font-weight:800; padding:4px 12px; border:1.5px solid var(--line); border-radius:12px; background:var(--bg-alt); }
  h1{ font-size:18px; letter-spacing:2px; margin:0; text-transform:uppercase; }
  .sub{ color:var(--text-dim); font-size:13px; margin:2px 0 12px; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 12px; }
  .chip{ border:1.5px solid var(--line); background:var(--bg-alt); color:var(--text-dim); border-radius:999px; padding:7px 14px; font-size:13px; font-weight:800; cursor:pointer; }
  .chip.active{ color:var(--text); border-color:var(--accent); background:color-mix(in srgb, var(--accent) 18%, var(--bg-alt)); }
  #status{ text-align:center; font-weight:800; font-size:15px; min-height:24px; margin:4px 0 8px; }
  .boardwrap{ position:relative; width:100%; }
  #board{ --cell:calc(min(100vw - 32px, 448px) / 8); display:grid; grid-template-columns:repeat(8, var(--cell)); grid-template-rows:repeat(8, var(--cell)); width:calc(var(--cell) * 8); margin:0 auto; border-radius:12px; overflow:hidden; border:2px solid var(--line); user-select:none; touch-action:manipulation; }
  .sq{ overflow:visible; position:relative; display:flex; align-items:center; justify-content:center; font-size:calc(var(--cell) * .74); line-height:1; cursor:pointer; }
  .sq.l{ background:var(--sq-light); } .sq.d{ background:var(--sq-dark); }
  .sq.last{ box-shadow:inset 0 0 0 100px rgba(246,246,105,.5); }
  .sq.sel{ box-shadow:inset 0 0 0 100px rgba(246,246,105,.65); }
  .sq.check{ box-shadow:inset 0 0 0 100px rgba(255,93,143,.55); }
  .sq.hint::after{ content:""; position:absolute; width:30%; height:30%; border-radius:50%; background:rgba(0,0,0,.25); }
  .sq.hint.cap::after{ width:86%; height:86%; background:none; border:4px solid rgba(0,0,0,.25); }
  .sq .coord{ position:absolute; font-size:calc(var(--cell) * .2); color:rgba(60,80,40,.7); font-weight:700; }
  .sq .rk{ top:2px; left:3px; } .sq .fl{ bottom:1px; right:3px; }
  .pc{ pointer-events:none; }
  .pc svg, .pcs{ width:100%; height:100%; display:block; }
  .pc{ width:100%; height:100%; display:flex; }
  .cap svg{ width:26px; height:26px; vertical-align:middle; }
  .row{ display:flex; gap:8px; margin-top:12px; }
  .btn{ flex:1; border:1.5px solid var(--line); background:var(--bg-alt); color:var(--text); border-radius:14px; padding:12px 8px; font-size:14px; font-weight:800; cursor:pointer; }
  .btn.primary{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#08110c; border:none; }
  .btn:disabled{ opacity:.4; }
  .cap{ min-height:26px; font-size:18px; letter-spacing:1px; color:var(--text-dim); margin:6px 2px; display:flex; flex-wrap:wrap; gap:0; }
  .cap span{ display:inline-block; }
  .log{ background:var(--panel); border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:12px; font-size:13px; color:var(--text-dim); max-height:120px; overflow:auto; line-height:1.7; }
  .log b{ color:var(--text); }
  .overlay{ position:fixed; inset:0; background:rgba(5,7,12,.82); display:none; align-items:center; justify-content:center; z-index:10; padding:20px; }
  .overlay.show{ display:flex; }
  .card{ background:var(--panel); border:1.5px solid var(--line); border-radius:20px; padding:22px 20px; width:100%; max-width:340px; text-align:center; }
  .card h2{ margin:0 0 6px; font-size:22px; }
  .card p{ color:var(--text-dim); margin:0 0 14px; font-size:14px; }
  .promo{ display:flex; gap:8px; justify-content:center; margin-top:8px; }
  .promo button svg{ width:100%; height:100%; } .promo button{ padding:4px; width:64px; height:64px; font-size:42px; border-radius:14px; border:1.5px solid var(--line); background:var(--bg-alt); color:#fff; text-shadow:0 0 2px #000; cursor:pointer; }
  .stats{ color:var(--text-dim); font-size:12px; text-align:center; margin-top:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="/" title="Brain Pulse" onclick="if(window.parent!==window){event.preventDefault();parent.postMessage({bpChessBack:true},location.origin);}">←</a><h1 id="title">Chess Original</h1></div>
  <div class="sub" id="sub"></div>
  <div class="chips" id="levels"></div>
  <div id="status"></div>
  <div class="cap" id="capBlack"></div>
  <div class="boardwrap"><div id="board"></div></div>
  <div class="cap" id="capWhite"></div>
  <div class="row">
    <button class="btn primary" id="newBtn"></button>
    <button class="btn" id="undoBtn"></button>
    <button class="btn" id="resignBtn"></button>
    <button class="btn" id="anaBtn"></button>
  </div>
  <div class="log" id="log"></div>
  <div class="stats" id="stats"></div>
</div>

<div class="overlay" id="promoOv"><div class="card"><h2 id="promoTitle"></h2><div class="promo" id="promoBtns"></div></div></div>
<div class="overlay" id="endOv"><div class="card"><h2 id="endTitle"></h2><p id="endText"></p><div class="row"><button class="btn primary" id="endNew"></button><button class="btn" id="endAna"></button><button class="btn" id="endClose"></button></div></div></div>

<script src="engine.js"></script>
<script src="analysis.js"></script>
<script src="/chess/pieces.js"></script>
<script>
"use strict";
const LANG = (function(){ try{ return localStorage.getItem("wq_lang") === "de" || !localStorage.getItem("wq_lang") ? "de" : "en"; }catch(e){ return "de"; } })();
const T = {
  de:{ title:"Chess Original", sub:"Klassisches Schach gegen den Bot. Du spielst Weiß.", level:"Stärke", l1:"Anfänger", l2:"Leicht", l3:"Mittel", l4:"Meister",
    yourTurn:"Du bist dran", thinking:"Bot denkt …", check:"Schach!", newGame:"Neu", undo:"Zurück", resign:"Aufgeben",
    win:"Gewonnen!", loss:"Verloren", draw:"Remis", mate:"Schachmatt", stalemate:"Patt", insufficient:"Zu wenig Material", fifty:"50-Züge-Regel", threefold:"Dreifache Stellungswiederholung",
    youWin:"Du hast den Bot besiegt.", youLose:"Der Bot war diesmal besser.", youDraw:"Unentschieden.", resigned:"Du hast aufgegeben.", again:"Nochmal", close:"Schließen",
    promo:"Umwandeln in", stats:(s)=>`Bilanz: ${s.games} Partien · ${s.wins} Siege · ${s.draws} Remis · ${s.losses} Niederlagen`, confirmResign:"Wirklich aufgeben?" },
  en:{ title:"Chess Original", sub:"Classic chess against the bot. You play White.", level:"Strength", l1:"Beginner", l2:"Easy", l3:"Medium", l4:"Master",
    yourTurn:"Your move", thinking:"Bot is thinking …", check:"Check!", newGame:"New", undo:"Undo", resign:"Resign",
    win:"You won!", loss:"You lost", draw:"Draw", mate:"Checkmate", stalemate:"Stalemate", insufficient:"Insufficient material", fifty:"50-move rule", threefold:"Threefold repetition",
    youWin:"You beat the bot.", youLose:"The bot was better this time.", youDraw:"It's a draw.", resigned:"You resigned.", again:"Play again", close:"Close",
    promo:"Promote to", stats:(s)=>`Record: ${s.games} games · ${s.wins} wins · ${s.draws} draws · ${s.losses} losses`, confirmResign:"Really resign?" }
}[LANG];
document.documentElement.lang = LANG;

const LEVELS = {
  1:{ depth:1, jitter:120, blunderChance:0.35 },
  2:{ depth:2, jitter:70,  blunderChance:0.12 },
  3:{ depth:2, jitter:10,  blunderChance:0.0  },
  4:{ depth:3, jitter:3,   blunderChance:0.0  }
};
const STATS_KEY = "bp_chess_orig", LEVEL_KEY = "bp_chess_level";
function loadStats(){ try{ const s = JSON.parse(localStorage.getItem(STATS_KEY) || "null"); if(s && typeof s.games === "number") return s; }catch(e){} return { games:0, wins:0, losses:0, draws:0 }; }
function saveStats(s){ try{ localStorage.setItem(STATS_KEY, JSON.stringify(s)); }catch(e){} }
let level = 2; try{ const l = parseInt(localStorage.getItem(LEVEL_KEY), 10); if(l >= 1 && l <= 4) level = l; }catch(e){}

const SYM = { K:"♚︎", Q:"♛︎", R:"♜︎", B:"♝︎", N:"♞︎", P:"♟︎" };
const $ = (id) => document.getElementById(id);
let G; // Spielstand

function newGame(){
  G = { board: initBoard(), turn:"w", last:null, selected:null, moves:[], over:false, log:[], capW:[], capB:[], history:[], half:0, seen:{}, busy:false, counted:false, rec:[] };
  G.seen[posKey()] = 1;
  render(); setStatus();
}
function posKey(){
  let k = G.turn;
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){ const p = G.board[r][c]; k += p ? (p.col+p.t+(p.moved?"m":"")) : "."; }
  if(G.last && G.last.dbl) k += "e"+G.last.tc;
  return k;
}
function snapshot(){ return { board:G.board, turn:G.turn, last:G.last, log:G.log.slice(), capW:G.capW.slice(), capB:G.capB.slice(), half:G.half, seen:Object.assign({}, G.seen) }; }
function restore(s){ G.board=s.board; G.turn=s.turn; G.last=s.last; G.log=s.log; G.capW=s.capW; G.capB=s.capB; G.half=s.half; G.seen=s.seen; G.selected=null; G.moves=[]; G.over=false; G.counted=false; }

function sqName(r,c){ return "abcdefgh"[c] + (8-r); }
function render(){
  const b = $("board"); b.innerHTML = "";
  const kingSq = isInCheck(G.board, G.turn) ? findKing(G.board, G.turn) : null;
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){
    const d = document.createElement("div");
    let cls = "sq " + ((r+c)%2===0 ? "l" : "d");
    if(G.last && ((G.last.fr===r&&G.last.fc===c)||(G.last.tr===r&&G.last.tc===c))) cls += " last";
    if(G.selected && G.selected.r===r && G.selected.c===c) cls += " sel";
    if(kingSq && kingSq[0]===r && kingSq[1]===c) cls += " check";
    const mv = G.moves.find(m => m.tr===r && m.tc===c);
    if(mv) cls += " hint" + (G.board[r][c] || mv.ep ? " cap" : "");
    d.className = cls; d.dataset.r = r; d.dataset.c = c;
    if(c===0) d.insertAdjacentHTML("beforeend", `<span class="coord rk">${8-r}</span>`);
    if(r===7) d.insertAdjacentHTML("beforeend", `<span class="coord fl">${"abcdefgh"[c]}</span>`);
    const p = G.board[r][c];
    if(p) d.insertAdjacentHTML("beforeend", `<span class="pc ${p.col}">${chessPieceSVG(p.t,p.col,"classic")}</span>`);
    b.appendChild(d);
  }
  $("capBlack").innerHTML = G.capB.map(t => `<span class="b">${chessPieceSVG(t,"b","classic")}</span>`).join("");
  $("capWhite").innerHTML = G.capW.map(t => `<span class="w">${chessPieceSVG(t,"w","classic")}</span>`).join("");
  const lg = $("log");
  const pairs = [];
  for(let i=0;i<G.log.length;i+=2) pairs.push(`<b>${i/2+1}.</b> ${G.log[i]}${G.log[i+1] ? "  " + G.log[i+1] : ""}`);
  lg.innerHTML = pairs.join(" &nbsp; "); lg.scrollTop = lg.scrollHeight;
  $("undoBtn").disabled = G.history.length === 0 || G.busy || G.over;
  $("resignBtn").disabled = G.over; $("anaBtn").disabled = !G.over || !G.rec.length;
  $("stats").textContent = T.stats(loadStats());
}
function setStatus(txt, color){
  if(!txt){
    if(G.over) txt = "";
    else if(G.busy) txt = T.thinking;
    else txt = isInCheck(G.board, G.turn) ? T.check : T.yourTurn;
  }
  const el = $("status"); el.textContent = txt;
  el.style.color = color || (isInCheck(G.board, "w") && !G.over ? "var(--bad)" : "var(--accent)");
}

$("board").addEventListener("click", (e) => {
  const t = e.target.closest(".sq"); if(!t || G.over || G.busy || G.turn !== "w") return;
  const r = +t.dataset.r, c = +t.dataset.c;
  const mv = G.moves.find(m => m.tr===r && m.tc===c);
  if(G.selected && mv){ tryMove(mv); return; }
  const p = G.board[r][c];
  if(p && p.col === "w"){ G.selected = { r, c }; G.moves = getLegalMoves(G.board, r, c, G.last); }
  else { G.selected = null; G.moves = []; }
  render();
});

function tryMove(mv){
  const p = G.board[mv.fr][mv.fc];
  if(p.t === "P" && mv.tr === 0){
    // Umwandlung waehlen
    const box = $("promoBtns"); box.innerHTML = ""; $("promoTitle").textContent = T.promo;
    ["Q","R","B","N"].forEach(t => {
      const b = document.createElement("button"); b.innerHTML = chessPieceSVG(t,"w","classic");
      b.onclick = () => { $("promoOv").classList.remove("show"); doMove(Object.assign({}, mv, { promTo:t }), true); };
      box.appendChild(b);
    });
    $("promoOv").classList.add("show");
    return;
  }
  doMove(mv, true);
}

function doMove(mv, byPlayer){
  if(byPlayer){ G.history.push(snapshot()); G.rec.push({ board:G.board, last:G.last, col:"w", move:Object.assign({}, mv) }); }
  const mover = G.board[mv.fr][mv.fc];
  const target = G.board[mv.tr][mv.tc];
  let captured = target ? target.t : null;
  if(mv.ep){ captured = "P"; }
  const sym = SYM[mover.t];
  let note = mv.castle ? (mv.castle === "k" ? "O-O" : "O-O-O") : `${sym}${sqName(mv.fr,mv.fc)}${captured ? "×" : "–"}${sqName(mv.tr,mv.tc)}${mv.promTo ? "=" + SYM[mv.promTo] : ""}`;
  G.board = applyMove(G.board, mv);
  if(captured){ (mover.col === "w" ? G.capW : G.capB).push(captured); }
  G.half = (mover.t === "P" || captured) ? 0 : G.half + 1;
  G.last = mv; G.turn = mover.col === "w" ? "b" : "w"; G.selected = null; G.moves = [];
  const k = posKey(); G.seen[k] = (G.seen[k] || 0) + 1;
  const reply = endCheck();
  if(reply){ G.log.push(note + (reply.why === T.mate ? "#" : "")); finish(reply); return; }
  G.log.push(note + (isInCheck(G.board, G.turn) ? "+" : ""));
  if(G.turn === "b"){ G.busy = true; render(); setStatus(); setTimeout(botMove, 60); }
  else { G.busy = false; render(); setStatus(); }
}

function endCheck(){
  const moves = getAllLegalMoves(G.board, G.turn, G.last);
  if(moves.length === 0){
    if(isInCheck(G.board, G.turn)) return { result: G.turn === "b" ? "win" : "loss", why: T.mate };
    return { result: "draw", why: T.stalemate };
  }
  if(insufficient()) return { result:"draw", why:T.insufficient };
  if(G.half >= 100) return { result:"draw", why:T.fifty };
  if((G.seen[posKey()] || 0) >= 3) return { result:"draw", why:T.threefold };
  return null;
}
function insufficient(){
  const pcs = [];
  for(let r=0;r<8;r++) for(let c=0;c<8;c++){ const p = G.board[r][c]; if(p && p.t !== "K") pcs.push({ p, r, c }); }
  if(pcs.length === 0) return true;
  if(pcs.length === 1 && (pcs[0].p.t === "B" || pcs[0].p.t === "N")) return true;
  if(pcs.length === 2 && pcs.every(x => x.p.t === "B") && ((pcs[0].r+pcs[0].c)%2) === ((pcs[1].r+pcs[1].c)%2)) return true;
  return false;
}

function botMove(){
  AI_LEVEL = LEVELS[level];
  const mv = getAIMove(G.board, G.last, []);
  G.busy = false;
  if(!mv){ finish(endCheck() || { result:"draw", why:T.stalemate }); return; }
  // Der Bot wandelt immer in eine Dame um (applyMove-Standard)
  doMove(mv, false);
}

function finish(res){
  G.over = true; G.busy = false;
  render();
  const title = res.result === "win" ? T.win : res.result === "loss" ? T.loss : T.draw;
  const text = (res.why ? res.why + " – " : "") + (res.result === "win" ? T.youWin : res.result === "loss" ? T.youLose : T.youDraw);
  setStatus(title, res.result === "win" ? "var(--accent)" : res.result === "loss" ? "var(--bad)" : "var(--accent-2)");
  if(!G.counted){
    G.counted = true;
    const s = loadStats(); s.games++;
    if(res.result === "win") s.wins++; else if(res.result === "loss") s.losses++; else s.draws++;
    saveStats(s);
    $("stats").textContent = T.stats(s);
  }
  $("endTitle").textContent = (res.result === "win" ? "🏆 " : res.result === "loss" ? "💀 " : "🤝 ") + title;
  $("endText").textContent = text;
  $("endOv").classList.add("show");
}

function buildUi(){
  $("title").textContent = T.title; $("sub").textContent = T.sub;
  const lv = $("levels"); lv.innerHTML = "";
  [1,2,3,4].forEach(i => {
    const b = document.createElement("div"); b.className = "chip" + (i === level ? " active" : ""); b.textContent = T["l"+i];
    b.onclick = () => { level = i; try{ localStorage.setItem(LEVEL_KEY, String(i)); }catch(e){} buildUi(); };
    lv.appendChild(b);
  });
  $("newBtn").textContent = T.newGame; $("undoBtn").textContent = T.undo; $("resignBtn").textContent = T.resign;
  $("anaBtn").textContent = "🔎"; $("endAna").textContent = "🔎 " + bpAnalysis.label; $("endNew").textContent = T.again; $("endClose").textContent = T.close;
}
$("newBtn").onclick = () => { newGame(); };
$("undoBtn").onclick = () => { if(G.busy || !G.history.length) return; restore(G.history.pop()); G.rec.pop(); render(); setStatus(); };
$("resignBtn").onclick = () => { if(G.over || !confirm(T.confirmResign)) return; finish({ result:"loss", why:T.resigned }); };
$("endNew").onclick = () => { $("endOv").classList.remove("show"); newGame(); };
$("anaBtn").onclick = () => { bpAnalysis.show(G.rec); };
$("endAna").onclick = () => { $("endOv").classList.remove("show"); bpAnalysis.show(G.rec); };
$("endClose").onclick = () => { $("endOv").classList.remove("show"); };

buildUi(); newGame();
</script>
</body>
</html>
