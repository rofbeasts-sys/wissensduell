<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Weltall</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0f17;color:#eef1f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;user-select:none}
body{display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px}
.back{color:#eef1f7;font-size:20px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:transparent;border:1px solid #232b3b;cursor:pointer}
h1{font-size:14px;margin:0;flex:1;color:#8d97ad;font-weight:600;letter-spacing:.02em}
.pill{border:1px solid #232b3b;border-radius:99px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.main{flex:1;display:flex;flex-direction:column;padding:4px 18px 20px;max-width:560px;width:100%;margin:0 auto;min-height:0;overflow:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.tile{background:#121826;border:2px solid var(--c);border-radius:18px;padding:14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:120px;box-shadow:0 0 14px color-mix(in srgb,var(--c) 22%,transparent)}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:30px;line-height:34px}.tile b{font-size:16px}.tile small{color:#8d97ad;font-size:12px;line-height:1.3}
.tile .st{margin-top:auto;font-size:15px;letter-spacing:2px}.tile .bs{font-size:11px;color:#8d97ad}
.bar{height:4px;background:#1a2132;border-radius:3px;margin:4px 0 18px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;width:0;background:#c6ff3d;transition:width .25s}
.q{background:#121826;border:1px solid #1d2536;border-radius:20px;padding:24px 20px;text-align:center;font-size:clamp(19px,5vw,25px);line-height:1.35;font-weight:700;min-height:130px;display:flex;align-items:center;justify-content:center;flex:none}
.ans{display:flex;flex-direction:column;gap:10px;margin-top:14px;flex:none}
.ans button{background:#121826;border:1.5px solid #232b3b;border-radius:14px;color:#eef1f7;padding:15px 14px;font-size:16px;font-weight:600;cursor:pointer;text-align:left;line-height:1.3}
.ans button:active{background:#1a2234}
.ans button.ok{border-color:#3ddc84;background:#10261a;color:#9bf0be}.ans button.no{border-color:#ff5d6c;background:#2a1318;color:#ffa4ae;animation:sh .3s}
.ans button.dim{opacity:.45}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ex{min-height:40px;margin-top:12px;font-size:13px;color:#9aa6bf;text-align:center;line-height:1.4}
.pri{background:#c6ff3d;border:0;color:#0b0f17;border-radius:14px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;width:100%}
.sec{background:transparent;border:1px solid #232b3b;color:#eef1f7;border-radius:14px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-top:10px}
.center{text-align:center}.big{font-size:72px;font-weight:800;color:#c6ff3d;line-height:1.1}
.zp{color:#c6ff3d;font-weight:800;margin-top:8px}.hint{color:#6c768c;font-size:12px;margin-top:12px}
.stars{font-size:34px;letter-spacing:6px;margin:6px 0}
.mapwrap{background:#0e1320;border:1px solid #1d2536;border-radius:18px;padding:6px;margin-top:6px;flex:none}
.mapwrap svg{display:block;width:100%;max-height:52vh;height:auto}
.mapwrap path{stroke:#0b0f17;stroke-width:1.2;stroke-linejoin:round;cursor:pointer;transition:fill .15s}
.mapwrap .lb{font-size:11px;font-weight:800;fill:#06220f;pointer-events:none;text-anchor:middle}
.mapwrap .hit{fill:transparent;cursor:pointer}
.mapwrap .pulse{animation:pu .9s infinite}
@keyframes pu{50%{opacity:.55}}
.mp{margin-top:10px;background:#121826;border:1px solid #1d2536;border-radius:16px;padding:12px;flex:none}
.mp .lab{font-size:14px;font-weight:700;margin-bottom:8px;text-align:center;min-height:20px}
.mp .row2{display:flex;gap:8px}
.mp input{flex:1;min-width:0;background:#0b0f17;border:1.5px solid #232b3b;border-radius:12px;color:#eef1f7;padding:13px;font-size:16px;outline:none}
.mp input:focus{border-color:#ffd45a}.mp input.bad{border-color:#ff5d6c;animation:sh .3s}
.mp .bt{background:#c6ff3d;border:0;color:#0b0f17;border-radius:12px;padding:0 16px;font-weight:800;font-size:15px;cursor:pointer}
.mp .bt.g{background:transparent;border:1px solid #232b3b;color:#eef1f7;font-weight:600;font-size:13px;padding:0 12px}
.mp .acts{display:flex;gap:8px;margin-top:8px}
.mp .msg{min-height:18px;font-size:13px;text-align:center;margin-top:8px;color:#9aa6bf}
.sky{background:#080c18;background-image:radial-gradient(1px 1px at 12% 14%,#fff,transparent),radial-gradient(1px 1px at 70% 30%,#cfe3ff,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff,transparent),radial-gradient(1px 1px at 88% 80%,#fff,transparent),radial-gradient(1px 1px at 25% 90%,#cfe3ff,transparent)}
.stage{position:relative;border:1px solid #1d2536;border-radius:18px;overflow:hidden;margin-top:6px;flex:none;height:min(72vw,380px);min-height:270px}
.stage .sun{position:absolute;left:-72px;top:50%;width:112px;height:112px;margin-top:-56px;border-radius:50%;background:radial-gradient(circle,#fff6c2,#ffb02e 55%,#ff7a1a);box-shadow:0 0 60px #ff9a2e88}
.orb{position:absolute;left:0;top:50%;border:1px dashed #26314d;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.pb{position:absolute;border-radius:50%;cursor:pointer;transform:translate(-50%,-50%)}
.pb::after{content:"";position:absolute;inset:-12px;border-radius:50%}
.pb.sel{outline:3px dashed #ffd45a;outline-offset:5px;animation:pu .9s infinite}
.pb.ok{outline:3px solid #3ddc84;outline-offset:3px}.pb.rv{outline:3px solid #1fa8d6;outline-offset:3px}
.pb.rg::before{content:"";position:absolute;left:50%;top:50%;width:calc(100% + 40px);height:22px;margin-left:calc(-50% - 20px);margin-top:-8px;border:4px solid #d7bd88;border-radius:50%;transform:rotate(-18deg);opacity:.9;pointer-events:none}
.pnm{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:5px;font-size:11px;font-weight:800;white-space:nowrap;text-shadow:0 1px 3px #000;pointer-events:none}
.fact{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #1d2536;padding:9px 2px;font-size:14px}.fact span{color:#8d97ad}.fact b{text-align:right}
.card{background:#0e1320;border:1px solid #1d2536;border-radius:18px;padding:12px 14px;margin-top:10px}
.row{display:flex;gap:12px;align-items:center;background:#121826;border:1.5px solid #232b3b;border-radius:16px;padding:10px 14px;margin-top:8px;cursor:pointer}
.row .sp{border-radius:50%;flex:none;position:relative}
.ord{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;margin-top:14px}
.ord .o{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:12px;font-weight:700}
.ord .o .sp{border-radius:50%;position:relative}.ord .o.d{opacity:.45}.ord .o .nr{position:absolute;right:-6px;top:-6px;background:#3ddc84;color:#06220f;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:900}
.ord .o.no{animation:sh .3s}.sp{border-radius:50%;position:relative;flex:none}.sp.rg::before{content:"";position:absolute;left:50%;top:50%;width:calc(100% + 28%);height:calc(10% + 6px);margin-left:calc(-50% - 14%);margin-top:calc(-5% - 1px);border:3px solid #d7bd88;border-radius:50%;transform:rotate(-18deg);opacity:.9;pointer-events:none}
</style></head><body>
<div class="top"><button class="back" id="back">←</button><h1 id="title">🪐 Planets</h1><span class="pill" id="pg" style="display:none"></span></div>
<div class="main" id="main"></div>
<script src="data.js"></script>
<script>
(function(){
var PP=null; try{ if(window.parent!==window&&typeof window.parent.fruitData==="function") PP=window.parent; }catch(e){}
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function sfx(n){ try{ PP&&PP.sfx&&PP.sfx(n); }catch(e){} }
function api(p,b){ try{ if(PP&&PP.tfApi) return PP.tfApi(p,b||{}); }catch(e){} return Promise.resolve(null); }
function hasAcc(){ try{ return !!(PP&&PP.tfHasAccount&&PP.tfHasAccount()); }catch(e){ return false; } }
var ROUND=10, prog={}; try{ prog=JSON.parse(localStorage.getItem("bp_space")||"{}")||{}; }catch(e){}
function save(){ try{ localStorage.setItem("bp_space",JSON.stringify(prog)); }catch(e){} }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function mstars(n){ return n>=3?"⭐⭐⭐":n==2?"⭐⭐☆":n==1?"⭐☆☆":"☆☆☆"; }
function stars(n){ return n>=10?"⭐⭐⭐":n>=8?"⭐⭐☆":n>=5?"⭐☆☆":"☆☆☆"; }
function norm(t){ return String(t).toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z]/g,""); }
function lev(a,b){ var m=a.length,n=b.length,d=[],i,j; for(i=0;i<=m;i++){ d[i]=[i]; } for(j=1;j<=n;j++) d[0][j]=j; for(i=1;i<=m;i++) for(j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
var AL={"moon":"mond","erdmond":"mond","luna":"mond","mercury":"merkur","earth":"erde","neptune":"neptun","erdball":"erde"};
function matches(input,answer){ var a=norm(input), b=norm(answer); if(!a) return false; if(AL[a]) a=AL[a]; if(a===b) return true; var tol=b.length>=7?2:b.length>=5?1:0; return tol>0&&lev(a,b)<=tol; }
var G=null, M=null, O=null;
$("back").onclick=function(){ if(G&&!G.end||M||O){ G=null; M=null; O=null; home(); return; } if(window.parent!==window) parent.postMessage({bpSpaceBack:true},location.origin); else location.href="/"; };
function sph(p,sz){ return '<div class="sp'+(p.ring?' rg':'')+'" style="width:'+sz+'px;height:'+sz+'px;background:'+p.bg+';box-shadow:0 0 14px rgba(160,180,255,.25)"></div>'; }
function home(){
  G=null; M=null; O=null; $("pg").style.display="none"; $("title").textContent="🪐 Planets"; var m=$("main"), t=window.SPACE, mapDone=(prog.wsk|0)>0;
  var tiles='<div class="tile" style="grid-column:1/-1;--c:#7cff8c;min-height:0;flex-direction:row;align-items:center;gap:12px" data-k="map"><span class="ic">🔭</span><div style="flex:1"><b>Sonnensystem-Karte</b><br><small>Tippe einen Himmelskörper an und schreibe den Namen</small></div><span class="st" style="margin:0">'+mstars(prog.wsk|0)+'</span></div>';
  tiles+='<div class="tile" style="--c:#b07aff" data-k="facts"><span class="ic">📖</span><b>Steckbriefe</b><small>Planeten, Mond, Pluto, Milchstraße und mehr</small><span class="bs">'+ALLF().length+' Steckbriefe</span></div>';
  tiles+=t.map(function(x){ var b=prog["q"+x.k]|0; return '<div class="tile" style="--c:'+x.c+'" data-k="'+x.k+'"><span class="ic">'+x.ic+'</span><b>'+esc(x.de)+'</b><small>'+esc(x.sub)+'</small><span class="st">'+stars(b)+'</span><span class="bs">'+(b?('Bestwert '+b+' / '+ROUND):(x.q.length+' Fragen'))+'</span></div>'; }).join("");
  tiles+='<div class="tile" style="--c:#c6ff3d" data-k="mix"><span class="ic">🎲</span><b>Mix</b><small>Zufällig aus allen Themen</small><span class="st">'+stars(prog.qmix|0)+'</span><span class="bs">Alle Themen</span></div>';
  tiles+=mapDone?'<div class="tile" style="grid-column:1/-1;--c:#ffd45a;min-height:0;flex-direction:row;align-items:center;gap:12px" data-k="order"><span class="ic">🧮</span><div style="flex:1"><b>Reihenfolge-Spiel</b><br><small>Ordne die Planeten nach Abstand zur Sonne</small></div><span class="st" style="margin:0">'+mstars(prog.wre|0)+'</span></div>'
    :'<div class="tile" style="grid-column:1/-1;--c:#5b6478;opacity:.75;min-height:0;flex-direction:row;align-items:center;gap:12px" data-k="lock"><span class="ic">🔒</span><div style="flex:1"><b>Reihenfolge-Spiel</b><br><small>Wird frei, sobald du die Sonnensystem-Karte geschafft hast.</small></div></div>';
  tiles+=mapDone?'<div class="tile" style="grid-column:1/-1;--c:#8f7bff;min-height:0;flex-direction:row;align-items:center;gap:12px" data-k="addr"><span class="ic">🌌</span><div style="flex:1"><b>Kosmische Adresse</b><br><small>Von der Erde bis zum Universum ordnen</small></div><span class="st" style="margin:0">'+mstars(prog.wad|0)+'</span></div>':'';
  m.innerHTML='<div class="center" style="margin-top:2px"><div style="font-size:13px;color:#8d97ad;line-height:1.4">Lerne das Sonnensystem kennen. Eine Runde hat '+ROUND+' Fragen.<br>Ab 8 Treffern gibt es beim ersten Mal Brainups.</div></div><div class="grid">'+tiles+'</div>'+(hasAcc()?'':'<div class="hint center">Melde dich an, um Brainups zu sammeln.</div>');
  Array.prototype.forEach.call(m.querySelectorAll(".tile"),function(el){ el.onclick=function(){ var k=el.getAttribute("data-k"); if(k==="lock") return; if(k==="map") mapPlay(); else if(k==="facts") factsList(); else if(k==="order") orderPlay(); else if(k==="addr") addrPlay(); else play(k); }; });
}
/* ---------- Quiz ---------- */
function play(k){
  var pool=[], name="Mix", c="#c6ff3d";
  if(k==="mix"){ window.SPACE.forEach(function(t){ t.q.forEach(function(q){ pool.push(q); }); }); }
  else { var t=window.SPACE.filter(function(x){ return x.k===k; })[0]; pool=t.q.slice(); name=t.de; c=t.c; }
  G={k:k,name:name,c:c,qs:shuffle(pool.slice()).slice(0,ROUND),i:0,ok:0,lock:false,end:false};
  $("pg").style.display=""; show();
}
function show(){
  var q=G.qs[G.i], m=$("main"); $("pg").textContent=(G.i+1)+" / "+ROUND; G.lock=false;
  var order=shuffle([0,1,2,3]); var ans=[q[1],q[2],q[3],q[4]]; G.cur={order:order};
  m.innerHTML='<div class="bar"><i style="width:'+(G.i/ROUND*100)+'%"></i></div><div class="q">'+esc(q[0])+'</div><div class="ans">'+order.map(function(oi,pos){ return '<button data-p="'+pos+'">'+esc(ans[oi])+'</button>'; }).join("")+'</div><div class="ex" id="ex"></div>';
  Array.prototype.forEach.call(m.querySelectorAll(".ans button"),function(b){ b.onclick=function(){ pick(+b.getAttribute("data-p")); }; });
}
function pick(pos){
  if(!G||G.lock) return; G.lock=true; var q=G.qs[G.i], o=G.cur.order, ok=(o[pos]===0), btns=document.querySelectorAll(".ans button"), rp=o.indexOf(0);
  Array.prototype.forEach.call(btns,function(b,i){ b.className=i===rp?"ok":i===pos?"no":"dim"; });
  if(ok){ G.ok++; sfx("good"); } else sfx("bad");
  var ex=$("ex"); ex.textContent=q[5]||(ok?"":"Richtig: "+q[1]); var wait=q[5]?2400:(ok?800:1500), done=false;
  function next(){ if(done||!G) return; done=true; G.i++; if(G.i>=ROUND) finish(); else show(); }
  var t=setTimeout(next,wait); document.querySelector(".ans").onclick=function(){ if(G&&G.lock){ clearTimeout(t); next(); } }; ex.onclick=function(){ clearTimeout(t); next(); };
}
var DIFF={pl:"wpl",mo:"wmo",so:"wso",gr:"wgr",ko:"wko",ra:"wra",ex:"wex"};
function finish(){
  var g=G; g.end=true; $("pg").style.display="none"; var pk="q"+g.k;
  if(g.ok>(prog[pk]|0)){ prog[pk]=g.ok; save(); }
  try{ PP&&PP.sfxResult&&PP.sfxResult(g.ok>=8,false); }catch(e){}
  $("main").innerHTML='<div class="center" style="margin-top:4vh"><div style="color:#8d97ad">'+esc(g.name)+'</div><div class="big">'+g.ok+' / '+ROUND+'</div><div class="stars">'+stars(g.ok)+'</div><div style="color:#8d97ad">'+(g.ok===ROUND?"Perfekt!":g.ok>=8?"Sehr stark!":g.ok>=5?"Gut gemacht!":"Übung macht den Meister.")+'</div><div class="zp" id="zpl"></div>'+(hasAcc()?'':'<div class="hint">Melde dich an, um Brainups zu bekommen.</div>')+'</div><div style="margin-top:auto;padding-top:20px"><button class="pri" id="ag">Nochmal</button><button class="sec" id="hm">Themen</button></div>';
  $("ag").onclick=function(){ play(g.k); }; $("hm").onclick=function(){ G=null; home(); };
  if(hasAcc()&&DIFF[g.k]&&g.ok>=8) api("/api/solo/submit",{game:"geo",val:g.ok,diff:DIFF[g.k]}).then(function(r){ if(r&&r.ok&&r.zp>0&&$("zpl")) $("zpl").textContent="+"+r.zp+" Brainups ⭐"; });
}
/* ---------- Steckbriefe ---------- */
function ALLF(){ return window.PLANETS.concat(window.EXTRA); }
function factsList(){
  O={}; $("title").textContent="📖 Steckbriefe"; var A=ALLF();
  $("main").innerHTML=A.map(function(p,i){ return (i===0?'<div class="hint" style="margin:4px 0 -2px">Die 8 Planeten</div>':i===8?'<div class="hint" style="margin:14px 0 -2px">Mehr im All</div>':'')+'<div class="row" data-i="'+i+'">'+sph(p,Math.min(46,p.sz*.6))+'<div style="flex:1"><b>'+esc(p.n)+'</b><br><small style="color:#8d97ad">'+esc(p.tag)+'</small></div><span style="color:#6c768c">›</span></div>'; }).join("");
  Array.prototype.forEach.call($("main").querySelectorAll(".row"),function(el){ el.onclick=function(){ factDetail(+el.getAttribute("data-i")); }; });
}
function factDetail(i){
  var A=ALLF(), n=A.length, p=A[i]; O={i:i}; $("title").textContent="📖 "+p.n;
  var big=Math.min(170,Math.round(p.sz*2.1));
  var rows=p.f?p.f.map(function(r,k){ return '<div class="fact"'+(k===p.f.length-1?' style="border:0"':'')+'><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>'; }).join(""):'<div class="fact"><span>Position</span><b>'+esc(p.pos)+'</b></div><div class="fact"><span>Durchmesser</span><b>'+esc(p.dm)+'</b></div><div class="fact"><span>Monde</span><b>'+esc(p.mo)+'</b></div><div class="fact"><span>Ein Tag dauert</span><b>'+esc(p.day)+'</b></div><div class="fact"><span>Ein Jahr dauert</span><b>'+esc(p.yr)+'</b></div><div class="fact" style="border:0"><span>Besonderheit</span><b>'+esc(p.sp)+'</b></div>';
  $("main").innerHTML='<div style="display:grid;place-items:center;height:'+(big+50)+'px">'+sph(p,big)+'</div><div class="center"><div style="font-size:26px;font-weight:800">'+esc(p.n)+'</div><div style="color:#8d97ad;font-size:13px">'+esc(p.tag)+'</div></div>'
   +'<div class="card">'+rows+'</div>'
   +'<div class="card" style="font-size:14px;line-height:1.45">💡 <b>Merke:</b> '+esc(p.memo)+'</div>'
   +'<div style="display:flex;gap:10px;margin-top:14px"><button class="sec" id="fp" style="margin:0">← Zurück</button><button class="pri" id="fn" style="flex:1">Nächster →</button></div>';
  $("fp").onclick=function(){ factDetail((i+n-1)%n); }; $("fn").onclick=function(){ factDetail((i+1)%n); };
}
/* ---------- Kosmische Adresse ---------- */
function addrPlay(){ O={ord:shuffle([0,1,2,3,4,5]),next:0,wrong:0,t0:Date.now(),addr:1}; $("pg").style.display=""; $("title").textContent="🌌 Kosmische Adresse"; addrDraw(); }
function addrDraw(){
  var A=window.ADDR; $("pg").textContent=O.next+" / "+A.length;
  $("main").innerHTML='<div class="center" style="margin-top:4px;font-size:14px;color:#cfd6e6;line-height:1.4">Wo wohnen wir im All? Tippe der Reihe nach an, <b style="color:#ffd45a">vom Kleinsten zum Größten</b>.<br>Zuerst unser Planet.</div>'+O.ord.map(function(ai){ var a=A[ai], d=ai<O.next; return '<div class="row" data-i="'+ai+'" style="'+(d?'opacity:.55;border-color:#3ddc84':'')+'"><div style="flex:1"><b>'+(d?(ai+1)+". ":"")+(d?esc(a.n):"?")+'</b>'+(d?'<br><small style="color:#8d97ad">'+esc(a.sub)+'</small>':'')+'</div></div>'; }).join("")+'<div class="msg center" id="omsg" style="margin-top:16px;color:#9aa6bf;font-size:13px">Fehler: '+O.wrong+'</div>';
  Array.prototype.forEach.call($("main").querySelectorAll(".row"),function(el){ el.onclick=function(){ addrTap(+el.getAttribute("data-i"),el); }; });
}
function addrTap(ai,el){
  if(!O||!O.addr||ai<O.next) return;
  if(ai===O.next){ O.next++; sfx("good"); if(O.next>=window.ADDR.length){ addrDraw(); setTimeout(addrFinish,700); } else addrDraw(); }
  else { O.wrong++; sfx("bad"); el.style.borderColor="#ff5d6c"; var ms=$("omsg"); if(ms) ms.textContent="Nicht ganz, da kommt noch etwas Kleineres. Fehler: "+O.wrong; setTimeout(function(){ if(el) el.style.borderColor=""; },400); }
}
function addrFinish(){
  var st=O.wrong<=1?3:O.wrong<=4?2:1, secs=Math.round((Date.now()-O.t0)/1000), wr=O.wrong; O=null; $("pg").style.display="none";
  if(st>(prog.wad|0)){ prog.wad=st; save(); }
  try{ PP&&PP.sfxResult&&PP.sfxResult(true,false); }catch(e){}
  $("main").innerHTML='<div class="center" style="margin-top:4vh"><div style="color:#8d97ad">Kosmische Adresse</div><div class="big" style="font-size:54px">6 / 6</div><div class="stars">'+mstars(st)+'</div><div style="color:#8d97ad">Zeit '+secs+' s · Fehler '+wr+'</div><div class="zp" id="zpl"></div>'+(hasAcc()?'':'<div class="hint">Melde dich an, um Brainups zu bekommen.</div>')+'</div><div style="margin-top:auto;padding-top:20px"><button class="pri" id="ag">Nochmal</button><button class="sec" id="hm">Themen</button></div>';
  $("ag").onclick=addrPlay; $("hm").onclick=home;
  if(hasAcc()) api("/api/solo/submit",{game:"geo",val:st===3?10:8,diff:"wad"}).then(function(r){ if(r&&r.ok&&r.zp>0&&$("zpl")) $("zpl").textContent="+"+r.zp+" Brainups ⭐"; });
}
/* ---------- Sonnensystem-Karte ---------- */
var XP=[19,27,35,43,55,66,76,85,44,94], YP=[38,66,36,64,50,34,66,42,18,62];
function MT(){ return window.PLANETS.concat(window.MOONPL); }
function mapPlay(){ M={solved:{},sel:null,wrong:0,hints:0,reveal:0,t0:Date.now(),tip:0,msg:"",done:false}; $("pg").style.display=""; $("title").textContent="🔭 Karte"; mapDraw(); }
function mapDraw(){
  var P=MT(), m=$("main"), n=Object.keys(M.solved).length; $("pg").textContent=n+" / "+P.length;
  m.innerHTML='<div class="stage sky" id="stg"><div class="sun"></div>'+P.slice(0,8).map(function(p,i){ return '<div class="orb" style="width:'+(XP[i]*2)+'%;height:'+(XP[i]*2)+'%;padding-bottom:0"></div>'; }).join("")+P.map(function(p,i){ var st=M.solved[i], sel=M.sel===i, sz=Math.round(p.sz*(i>=8?1:.8));
    return '<div class="pb'+(p.ring?' rg':'')+(sel?' sel':'')+(st==="g"?' ok':st==="r"?' rv':'')+'" data-i="'+i+'" style="left:'+XP[i]+'%;top:'+YP[i]+'%;width:'+sz+'px;height:'+sz+'px;background:'+p.bg+'">'+(st?'<span class="pnm" style="color:'+(st==="g"?"#7cff9c":"#6fd0ff")+'">'+esc(p.n)+'</span>':'')+'</div>'; }).join("")+'</div>'
   +'<div class="mp"><div class="lab">'+(M.sel!=null?'Wie heißt dieser Himmelskörper?':'Tippe einen Himmelskörper an und schreibe seinen Namen.')+'</div>'+(M.sel!=null?'<div class="row2"><input id="mi" type="text" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" placeholder="Name …"><button class="bt" id="mok">Prüfen</button></div><div class="acts"><button class="bt g" id="mtip">💡 Tipp</button><button class="bt g" id="mrev">👁 Auflösen</button></div>':'')+'<div class="msg" id="mmsg">'+esc(M.msg||"")+'</div></div>';
  var o=m.querySelectorAll(".orb"), w=$("stg").clientWidth, h=$("stg").clientHeight; if(0)h=0; Array.prototype.forEach.call(o,function(e,i){ e.style.width=(XP[i]/100*w*2)+"px"; e.style.height=(XP[i]/100*w*2)+"px"; });
  Array.prototype.forEach.call(m.querySelectorAll(".pb"),function(el){ el.onclick=function(){ var i=+el.getAttribute("data-i"); if(M.solved[i]) return; M.sel=i; M.tip=0; M.msg=""; sfx("tap"); mapDraw(); }; });
  if(M.sel!=null){ $("mok").onclick=mapCheck; $("mtip").onclick=mapTip; $("mrev").onclick=mapReveal; $("mi").onkeydown=function(e){ if(e.key==="Enter") mapCheck(); }; try{ $("mi").focus({preventScroll:true}); }catch(e){} }
}
function mapCheck(){
  var p=MT()[M.sel];
  if(matches($("mi").value,p.n)){ M.solved[M.sel]="g"; M.msg="Richtig! "+p.n+" · "+p.tag; M.sel=null; sfx("good"); mapAfter(); }
  else { M.wrong++; M.msg="Nicht ganz. Versuch es nochmal oder nimm einen Tipp."; sfx("bad"); var i=$("mi"); i.className="bad"; $("mmsg").textContent=M.msg; setTimeout(function(){ if($("mi")) $("mi").className=""; },350); }
}
function mapTip(){ var p=MT()[M.sel]; M.tip++; M.hints++; M.msg=M.tip===1?p.tip:"Beginnt mit „"+p.n.slice(0,Math.min(p.n.length-1,M.tip-1))+"“ ("+p.n.length+" Buchstaben)"; $("mmsg").textContent=M.msg; }
function mapReveal(){ var p=MT()[M.sel]; M.reveal++; M.solved[M.sel]="r"; M.msg="Es war: "+p.n+" · "+p.tag; M.sel=null; sfx("tap"); mapAfter(); }
function mapAfter(){ if(Object.keys(M.solved).length>=MT().length){ M.done=true; mapDraw(); setTimeout(mapFinish,900); } else mapDraw(); }
function mapFinish(){
  var secs=Math.round((Date.now()-M.t0)/1000), bad=M.wrong+M.hints+M.reveal*2, st=bad<=1?3:bad<=4?2:1, mm=Math.floor(secs/60), ss=("0"+(secs%60)).slice(-2);
  if(st>(prog.wsk|0)){ prog.wsk=st; save(); }
  try{ PP&&PP.sfxResult&&PP.sfxResult(true,false); }catch(e){}
  var wr=M.wrong, h=M.hints, rv=M.reveal; M=null; $("pg").style.display="none";
  $("main").innerHTML='<div class="center" style="margin-top:4vh"><div style="color:#8d97ad">Sonnensystem-Karte</div><div class="big" style="font-size:54px">10 / 10</div><div class="stars">'+mstars(st)+'</div><div style="color:#8d97ad">Zeit '+mm+':'+ss+' · Fehler '+wr+' · Tipps '+h+' · Aufgelöst '+rv+'</div><div class="zp" id="zpl"></div>'+(hasAcc()?'':'<div class="hint">Melde dich an, um Brainups zu bekommen.</div>')+'<div class="hint" style="color:#ffd45a">🔓 Reihenfolge-Spiel freigeschaltet</div></div><div style="margin-top:auto;padding-top:20px"><button class="pri" id="ag">Nochmal</button><button class="sec" id="hm">Themen</button></div>';
  $("ag").onclick=mapPlay; $("hm").onclick=home;
  if(hasAcc()) api("/api/solo/submit",{game:"geo",val:st===3?10:8,diff:"wsk"}).then(function(r){ if(r&&r.ok&&r.zp>0&&$("zpl")) $("zpl").textContent="+"+r.zp+" Brainups ⭐"; });
}
/* ---------- Reihenfolge-Spiel ---------- */
function orderPlay(){ O={order:shuffle([0,1,2,3,4,5,6,7]),next:0,wrong:0,t0:Date.now(),game:1}; $("pg").style.display=""; $("title").textContent="🧮 Reihenfolge"; orderDraw(); }
function orderDraw(){
  var P=window.PLANETS; $("pg").textContent=O.next+" / 8";
  $("main").innerHTML='<div class="center" style="margin-top:4px;font-size:14px;color:#cfd6e6;line-height:1.4">Tippe die Planeten der Reihe nach an, <b style="color:#ffd45a">von der Sonne nach außen</b>.<br>Zuerst der sonnennächste.</div><div class="ord">'+O.order.map(function(pi){ var p=P[pi], d=pi<O.next; return '<div class="o'+(d?' d':'')+'" data-i="'+pi+'"><div class="sp'+(p.ring?' rg':'')+'" style="width:'+Math.min(58,Math.round(p.sz*.72))+'px;height:'+Math.min(58,Math.round(p.sz*.72))+'px;background:'+p.bg+'">'+(d?'<span class="nr">'+(pi+1)+'</span>':'')+'</div><span>'+(d?esc(p.n):'?')+'</span></div>'; }).join("")+'</div><div class="msg center" id="omsg" style="margin-top:16px;color:#9aa6bf;font-size:13px">Fehler: '+O.wrong+'</div>';
  Array.prototype.forEach.call($("main").querySelectorAll(".o"),function(el){ el.onclick=function(){ orderTap(+el.getAttribute("data-i"),el); }; });
}
function orderTap(pi,el){
  if(!O||!O.game||pi<O.next) return;
  if(pi===O.next){ O.next++; sfx("good"); if(O.next>=8){ orderDraw(); setTimeout(orderFinish,700); } else orderDraw(); }
  else { O.wrong++; sfx("bad"); el.className="o no"; var ms=$("omsg"); if(ms) ms.textContent="Falsch, es kommt noch ein näherer Planet. Fehler: "+O.wrong; setTimeout(function(){ if(el) el.className="o"; },400); }
}
function orderFinish(){
  var st=O.wrong<=1?3:O.wrong<=4?2:1, secs=Math.round((Date.now()-O.t0)/1000), wr=O.wrong; O=null; $("pg").style.display="none";
  if(st>(prog.wre|0)){ prog.wre=st; save(); }
  try{ PP&&PP.sfxResult&&PP.sfxResult(true,false); }catch(e){}
  $("main").innerHTML='<div class="center" style="margin-top:4vh"><div style="color:#8d97ad">Reihenfolge-Spiel</div><div class="big" style="font-size:54px">8 / 8</div><div class="stars">'+mstars(st)+'</div><div style="color:#8d97ad">Zeit '+secs+' s · Fehler '+wr+'</div><div class="zp" id="zpl"></div>'+(hasAcc()?'':'<div class="hint">Melde dich an, um Brainups zu bekommen.</div>')+'</div><div style="margin-top:auto;padding-top:20px"><button class="pri" id="ag">Nochmal</button><button class="sec" id="hm">Themen</button></div>';
  $("ag").onclick=orderPlay; $("hm").onclick=home;
  if(hasAcc()) api("/api/solo/submit",{game:"geo",val:st===3?10:8,diff:"wre"}).then(function(r){ if(r&&r.ok&&r.zp>0&&$("zpl")) $("zpl").textContent="+"+r.zp+" Brainups ⭐"; });
}
home();
})();
</script></body></html>
