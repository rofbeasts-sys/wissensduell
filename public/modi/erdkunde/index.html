<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Erdkunde</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0f17;color:#eef1f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;user-select:none}
body{display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px}
.back{color:#eef1f7;font-size:20px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:transparent;border:1px solid #232b3b;cursor:pointer}
h1{font-size:14px;margin:0;flex:1;color:#8d97ad;font-weight:600;letter-spacing:.02em}
.pill{border:1px solid #232b3b;border-radius:99px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.main{flex:1;display:flex;flex-direction:column;padding:4px 18px 20px;max-width:560px;width:100%;margin:0 auto;min-height:0;overflow:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.tile{background:#121826;border:2px solid var(--c);border-radius:18px;padding:14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:120px;box-shadow:0 0 14px color-mix(in srgb,var(--c) 22%,transparent)}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:30px;line-height:34px}.tile b{font-size:16px}.tile small{color:#8d97ad;font-size:12px;line-height:1.3}
.tile .st{margin-top:auto;font-size:15px;letter-spacing:2px}.tile .bs{font-size:11px;color:#8d97ad}
.bar{height:4px;background:#1a2132;border-radius:3px;margin:4px 0 18px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;width:0;background:#c6ff3d;transition:width .25s}
.q{background:#121826;border:1px solid #1d2536;border-radius:20px;padding:24px 20px;text-align:center;font-size:clamp(19px,5vw,25px);line-height:1.35;font-weight:700;min-height:130px;display:flex;align-items:center;justify-content:center;flex:none}
.ans{display:flex;flex-direction:column;gap:10px;margin-top:14px;flex:none}
.ans button{background:#121826;border:1.5px solid #232b3b;border-radius:14px;color:#eef1f7;padding:15px 14px;font-size:16px;font-weight:600;cursor:pointer;text-align:left;line-height:1.3}
.ans button:active{background:#1a2234}
.ans button.ok{border-color:#3ddc84;background:#10261a;color:#9bf0be}.ans button.no{border-color:#ff5d6c;background:#2a1318;color:#ffa4ae;animation:sh .3s}
.ans button.dim{opacity:.45}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ex{min-height:40px;margin-top:12px;font-size:13px;color:#9aa6bf;text-align:center;line-height:1.4}
.pri{background:#c6ff3d;border:0;color:#0b0f17;border-radius:14px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;width:100%}
.sec{background:transparent;border:1px solid #232b3b;color:#eef1f7;border-radius:14px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-top:10px}
.center{text-align:center}.big{font-size:72px;font-weight:800;color:#c6ff3d;line-height:1.1}
.zp{color:#c6ff3d;font-weight:800;margin-top:8px}.hint{color:#6c768c;font-size:12px;margin-top:12px}
.stars{font-size:34px;letter-spacing:6px;margin:6px 0}
.mapwrap{background:#0e1320;border:1px solid #1d2536;border-radius:18px;padding:6px;margin-top:6px;flex:none}
.mapwrap svg{display:block;width:100%;max-height:52vh;height:auto}
.mapwrap path{stroke:#0b0f17;stroke-width:1.2;stroke-linejoin:round;cursor:pointer;transition:fill .15s}
.mapwrap .lb{font-size:11px;font-weight:800;fill:#06220f;pointer-events:none;text-anchor:middle}
.mapwrap .hit{fill:transparent;cursor:pointer}
.mapwrap .pulse{animation:pu .9s infinite}
@keyframes pu{50%{opacity:.55}}
.mp{margin-top:10px;background:#121826;border:1px solid #1d2536;border-radius:16px;padding:12px;flex:none}
.mp .lab{font-size:14px;font-weight:700;margin-bottom:8px;text-align:center;min-height:20px}
.mp .row2{display:flex;gap:8px}
.mp input{flex:1;min-width:0;background:#0b0f17;border:1.5px solid #232b3b;border-radius:12px;color:#eef1f7;padding:13px;font-size:16px;outline:none}
.mp input:focus{border-color:#ffd45a}.mp input.bad{border-color:#ff5d6c;animation:sh .3s}
.mp .bt{background:#c6ff3d;border:0;color:#0b0f17;border-radius:12px;padding:0 16px;font-weight:800;font-size:15px;cursor:pointer}
.mp .bt.g{background:transparent;border:1px solid #232b3b;color:#eef1f7;font-weight:600;font-size:13px;padding:0 12px}
.mp .acts{display:flex;gap:8px;margin-top:8px}
.mp .msg{min-height:18px;font-size:13px;text-align:center;margin-top:8px;color:#9aa6bf}
</style></head><body>
<div class="top"><button class="back" id="back">←</button><h1 id="title">🌍 Erdkunde</h1><span class="pill" id="pg" style="display:none"></span></div>
<div class="main" id="main"></div>
<script src="data.js"></script>
<script src="map-de.js"></script>
<script src="map-world.js"></script>
<script src="map-us.js"></script>
<script src="map-en.js"></script>
<script>
(function(){
var PP=null; try{ if(window.parent!==window&&typeof window.parent.fruitData==="function") PP=window.parent; }catch(e){}
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function sfx(n){ try{ PP&&PP.sfx&&PP.sfx(n); }catch(e){} }
function api(p,b){ try{ if(PP&&PP.tfApi) return PP.tfApi(p,b||{}); }catch(e){} return Promise.resolve(null); }
function hasAcc(){ try{ return !!(PP&&PP.tfHasAccount&&PP.tfHasAccount()); }catch(e){ return false; } }
var ROUND=10, prog={}; try{ prog=JSON.parse(localStorage.getItem("bp_geo")||"{}")||{}; }catch(e){}
function lockLeft(){ try{ var t=+localStorage.getItem("bp_geo_lock")||0; return Math.max(0,t-Date.now()); }catch(e){ return 0; } }
function lockTxt(ms){ var h=Math.floor(ms/3600000), m=Math.ceil((ms%3600000)/60000); if(m===60){ h++; m=0; } return h+" Std. "+m+" Min."; }
function save(){ try{ localStorage.setItem("bp_geo",JSON.stringify(prog)); }catch(e){} }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function mstars(n){ return n>=3?"⭐⭐⭐":n==2?"⭐⭐☆":n==1?"⭐☆☆":"☆☆☆"; }
function stars(n){ return n>=10?"⭐⭐⭐":n>=8?"⭐⭐☆":n>=5?"⭐☆☆":"☆☆☆"; }
var G=null;
$("back").onclick=function(){ if(G&&!G.end){ G=null; M=null; home(); return; } if(window.parent!==window) parent.postMessage({bpGeoBack:true},location.origin); else location.href="/"; };
function home(){
  G=null; $("pg").style.display="none"; var m=$("main");
  var open_=window.GEO.some(function(t){ return t.k!=="de"&&(prog[t.k]|0)>=ROUND; });
  var ll=lockLeft();
  var tiles=(open_&&ll>0)?'<div class="tile" style="grid-column:1/-1;--c:#e0524d;opacity:.85" data-k="lock"><span class="ic">⏳</span><b>Karte gesperrt</b><small>3 Fehlversuche bei „Wo liegt Deutschland?". Nächster Versuch in '+lockTxt(ll)+'</small></div>':open_?'':'<div class="tile" style="grid-column:1/-1;--c:#5b6478;opacity:.75" data-k="lock"><span class="ic">🔒</span><b>Karte</b><small>Wird freigeschaltet, sobald du in einem Quiz-Thema alle '+ROUND+' Fragen richtig hast.</small></div>';
  tiles+=(!open_||ll>0)?'':'<div class="tile" style="grid-column:1/-1;--c:#7cff8c" data-k="map:list"><span class="ic">🗺️</span><b>Karte</b><small>Finde ein Land auf der Weltkarte, dann tippe seine Gebiete an und schreibe die Namen</small><span class="st">🇩🇪 🇺🇸 🏴󠁧󠁢󠁥󠁮󠁧󠁿</span><span class="bs">'+(((prog.mapall|0)?1:0)+((prog.mapus|0)?1:0)+((prog.mapen|0)?1:0))+' / 3 Länder'+'</span></div>';
  if(open_) tiles+='<div class="tile" style="--c:#ffb02e" data-k="map:cap"><span class="ic">🏛️</span><b>Karte: Hauptstädte</b><small>Tippe ein Land an und schreibe die Hauptstadt</small><span class="st">'+mstars(prog.mapcap|0)+'</span><span class="bs">'+((prog.mapcap|0)?'Bestwert':'16 Hauptstädte')+'</span></div>';
  var tt=window.GEO.filter(function(t){ return t.k!=="de"; }).map(function(t){ var b=prog[t.k]|0; return '<div class="tile" style="--c:'+t.c+'" data-k="'+t.k+'"><span class="ic">'+t.ic+'</span><b>'+esc(t.de)+'</b><small>'+esc(t.sub)+'</small><span class="st">'+stars(b)+'</span><span class="bs">'+(b?('Bestwert '+b+' / '+ROUND):(t.q.length+' Fragen'))+'</span></div>'; }).join("");
  tiles+=tt;
  tiles+='<div class="tile" style="--c:#c6ff3d" data-k="mix"><span class="ic">🎲</span><b>Mix</b><small>Zufällig aus allen Themen</small><span class="st">'+stars(prog.mix|0)+'</span><span class="bs">'+((prog.mix|0)?('Bestwert '+prog.mix+' / '+ROUND):'Alle Themen')+'</span></div>';
  m.innerHTML='<div class="center" style="margin-top:2px"><div style="font-size:13px;color:#8d97ad;line-height:1.4">Wähle ein Thema. Jede Runde hat '+ROUND+' Fragen.<br>Ab 8 Treffern gibt es beim ersten Mal Brainups, bei 10 von 10 noch mehr.</div></div><div class="grid">'+tiles+'</div>'+(hasAcc()?'':'<div class="hint center">Melde dich an, um Brainups zu bekommen.</div>');
  Array.prototype.forEach.call(m.querySelectorAll(".tile"),function(el){ el.onclick=function(){ var k=el.getAttribute("data-k"); if(k==="lock") return; if(k==="map:list") mapList(); else if(k.indexOf("map:")===0) mapPlay(k.slice(4)); else play(k); }; });
}
function play(k){
  var pool=[], name="Mix", c="#c6ff3d";
  if(k==="mix"){ window.GEO.forEach(function(t){ if(t.k==="de") return; t.q.forEach(function(q){ pool.push(q); }); }); }
  else { var t=window.GEO.filter(function(x){ return x.k===k; })[0]; pool=t.q.slice(); name=t.de; c=t.c; }
  var qs=shuffle(pool.slice()).slice(0,ROUND);
  G={k:k,name:name,c:c,qs:qs,i:0,ok:0,lock:false,end:false};
  $("pg").style.display=""; show();
}
function show(){
  var q=G.qs[G.i], m=$("main"); $("pg").textContent=(G.i+1)+" / "+ROUND; G.lock=false;
  var order=shuffle([0,1,2,3]); var ans=[q[1],q[2],q[3],q[4]]; G.cur={right:0,order:order};
  m.innerHTML='<div class="bar"><i id="bf" style="width:'+(G.i/ROUND*100)+'%"></i></div><div class="q">'+esc(q[0])+'</div><div class="ans">'+order.map(function(oi,pos){ return '<button data-p="'+pos+'">'+esc(ans[oi])+'</button>'; }).join("")+'</div><div class="ex" id="ex"></div>';
  Array.prototype.forEach.call(m.querySelectorAll(".ans button"),function(b){ b.onclick=function(){ pick(+b.getAttribute("data-p")); }; });
}
function pick(pos){
  if(!G||G.lock) return; G.lock=true; var q=G.qs[G.i], o=G.cur.order, ok=(o[pos]===0), btns=document.querySelectorAll(".ans button");
  var rp=o.indexOf(0);
  Array.prototype.forEach.call(btns,function(b,i){ if(i===rp) b.className="ok"; else if(i===pos) b.className="no"; else b.className="dim"; });
  if(ok){ G.ok++; sfx("good"); } else sfx("bad");
  var ex=$("ex"); ex.textContent=q[5]||(ok?"":"Richtig: "+q[1]); var wait=q[5]?2400:(ok?800:1500);
  var done=false; function next(){ if(done||!G) return; done=true; G.i++; if(G.i>=ROUND) finish(); else show(); }
  var t=setTimeout(next,wait); document.querySelector(".ans").onclick=function(){ if(G&&G.lock){ clearTimeout(t); next(); } }; ex.onclick=function(){ clearTimeout(t); next(); };
}
function finish(){
  var g=G; g.end=true; $("pg").style.display="none";
  if(g.ok>(prog[g.k]|0)){ prog[g.k]=g.ok; save(); }
  try{ PP&&PP.sfxResult&&PP.sfxResult(g.ok>=8,false); }catch(e){}
  var m=$("main");
  m.innerHTML='<div class="center" style="margin-top:4vh"><div style="color:#8d97ad">'+esc(g.name)+'</div><div class="big">'+g.ok+' / '+ROUND+'</div><div class="stars">'+stars(g.ok)+'</div><div style="color:#8d97ad">'+(g.ok===ROUND?"Perfekt!":g.ok>=8?"Sehr stark!":g.ok>=5?"Gut gemacht!":"Übung macht den Meister.")+'</div><div class="zp" id="zpl"></div>'+(hasAcc()?'':'<div class="hint">Melde dich an, um Brainups zu bekommen.</div>')+'</div><div style="margin-top:auto;padding-top:20px"><button class="pri" id="ag">Nochmal</button><button class="sec" id="hm">Themen</button></div>';
  $("ag").onclick=function(){ play(g.k); }; $("hm").onclick=function(){ G=null; home(); };
  if(hasAcc()&&g.k!=="mix"&&g.ok>=8) api("/api/solo/submit",{game:"geo",val:g.ok,diff:g.k}).then(function(r){ if(r&&r.ok&&r.zp>0&&$("zpl")) $("zpl").textContent="+"+r.zp+" Brainups ⭐"; });
}
/* ---------- Karte Deutschland ---------- */
var CAPS={"Baden-Württemberg":"Stuttgart","Bayern":"München","Berlin":"Berlin","Brandenburg":"Potsdam","Bremen":"Bremen","Hamburg":"Hamburg","Hessen":"Wiesbaden","Mecklenburg-Vorpommern":"Schwerin","Niedersachsen":"Hannover","Nordrhein-Westfalen":"Düsseldorf","Rheinland-Pfalz":"Mainz","Saarland":"Saarbrücken","Sachsen-Anhalt":"Magdeburg","Sachsen":"Dresden","Schleswig-Holstein":"Kiel","Thüringen":"Erfurt"};
var ALIAS={"kalifornien":"california","neumexiko":"newmexico","nordkarolina":"northcarolina","suedkarolina":"southcarolina","nordakota":"northdakota","suedakota":"southdakota","pennsylvanien":"pennsylvania","neuhampshire":"newhampshire","neuyork":"newyork","newyorkstaat":"newyork","neujersey":"newjersey","westvirginia":"westvirginia","rhodeisland":"rhodeisland","nordosten":"northeast","nordwesten":"northwest","suedosten":"southeast","suedwesten":"southwest","yorkshire":"yorkshireandthehumber","ostengland":"eastofengland","londres":"london","nrw":"nordrheinwestfalen","bw":"badenwuerttemberg","mv":"mecklenburgvorpommern","rlp":"rheinlandpfalz","sh":"schleswigholstein","bln":"berlin"};
function norm(t){ return String(t).toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z]/g,""); }
function lev(a,b){ var m=a.length,n=b.length,d=[],i,j; for(i=0;i<=m;i++){ d[i]=[i]; } for(j=1;j<=n;j++) d[0][j]=j; for(i=1;i<=m;i++) for(j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
function matches(input,answer){ var a=norm(input), b=norm(answer); if(!a) return false; if(ALIAS[a]) a=ALIAS[a]; if(a===b) return true; var tol=b.length>=11?2:b.length>=6?1:0; return tol>0&&lev(a,b)<=tol; }
var M=null;
var CC={pol:{g:"GEOMAP",key:"mappol",srv:"kp",nn:"Pole",n:"Pole",fl:"🧊"},np:{g:"GEOMAP",key:"mapnp",srv:"kn",nn:"Nordpol",n:"der Nordpol",fl:"🧊"},sp:{g:"GEOMAP",key:"mapsp",srv:"ks",nn:"Südpol",n:"der Südpol",fl:"🐧"},ata:{g:"GEOMAP",key:"mapata",srv:"ka",nn:"Antarktis",n:"die Antarktis",fl:"❄️"},de:{g:"GEOMAP",id:"DEU",n:"Deutschland",fl:"🇩🇪",pt:[529,108],w:60,key:"all",srv:"kt"},us:{g:"GEOMAP_US",id:"USA",n:"die USA",nn:"USA",fl:"🇺🇸",pt:[228,142],w:320,key:"us",srv:"ku"},en:{g:"GEOMAP_EN",id:"GBR",n:"England",nn:"England",fl:"🏴󠁧󠁢󠁥󠁮󠁧󠁿",pt:[494,103],w:50,key:"en",srv:"ke"}};
function mapItems(mode,cc){
  if(cc==="pol") return [{id:"pol0"},{id:"pol1"}]; if(POLT[cc]) return [{id:"pol0"}];
  if(cc&&cc!=="de"){ return window[CC[cc].g].s.slice().sort(function(a,b){ return b.a-a.a; }).map(function(f){ f.kind="state"; return f; }); }
  var g=window.GEOMAP, P=window.GEOPOI, st=g.s.slice().sort(function(a,b){ return b.a-a.a; }).map(function(f){ f.kind="state"; return f; });
  if(mode==="cap") return st;
  var o=st.slice(); P.peaks.forEach(function(f){ f.kind="peak"; o.push(f); }); P.ranges.forEach(function(f){ f.kind="range"; o.push(f); }); P.water.forEach(function(f){ f.kind=f.k==="Fluss"?"river":"water"; o.push(f); });
  return o;
}
function mapPlay(mode,cc){
  cc=cc||"de"; M={cc:cc,g:window[CC[cc].g],mode:mode,items:mapItems(mode,cc),solved:{},sel:null,wrong:0,hints:0,reveal:0,t0:Date.now(),tip:0,done:false,msg:""};
  M.stage=mode==="all"||cc!=="de"?"world":"de"; M.V={x:0,y:0,w:window.GEOWORLD.w,h:window.GEOWORLD.h}; M.wtip=0; M.wmsg=""; M.step=0;
  G={end:false,map:true}; $("pg").style.display=""; mapDraw();
}
function mapCount(){ return Object.keys(M.solved).length; }
function mapAns(f){ return M.mode==="cap"?CAPS[f.n]:f.n; }
function mapShort(f){ if(M.mode==="cap") return f.n; return f.n.length>10&&f.a<20000?f.n.replace("Nordrhein-Westfalen","NRW").replace("Mecklenburg-Vorpommern","MV").replace("Baden-Württemberg","BW").replace("Rheinland-Pfalz","RLP").replace("Schleswig-Holstein","SH").replace("Sachsen-Anhalt","S-Anhalt"):f.n; }
function mapCol(f,base){ var st=M.solved[f.id]; return st?(st==="r"?"#1fa8d6":"#3ddc84"):(M.sel===f.id?"#ffd45a":base); }
function mapMark(f){
  var col=mapCol(f,"#fff"), sel=M.sel===f.id, st=M.solved[f.id], cl=sel?' class="pulse"':'', ns=' style="pointer-events:none"';
  if(f.kind==="peak") return '<path d="M'+f.x+' '+(f.y-10)+'L'+(f.x+9)+' '+(f.y+6)+'L'+(f.x-9)+' '+(f.y+6)+'Z" fill="'+(st||sel?col:"#ff9f5a")+'" stroke="#0b0f17" stroke-width="1.5"'+cl+ns+'/>';
  if(f.kind==="river") return '<circle cx="'+f.x+'" cy="'+f.y+'" r="'+(sel?10:8)+'" fill="'+(st||sel?col:"#4db8ff")+'" stroke="#fff" stroke-width="2"'+cl+ns+'/>';
  var c=(st||sel)?col:(f.kind==="range"?"#c9a0ff":"#4db8ff"), r=f.kind==="range"?(sel?24:20):f.k==="Meer"?(sel?26:22):(sel?15:12);
  return '<circle cx="'+f.x+'" cy="'+f.y+'" r="'+r+'" fill="'+c+'" fill-opacity="'+(st?".55":".22")+'" stroke="'+c+'" stroke-width="2" stroke-dasharray="4 3"'+cl+ns+'/>';
}
function mapDraw(){
  if(M.stage==="world") return mapWorld();
  var g=M.g, m=$("main"), tot=M.items.length; $("pg").textContent=mapCount()+" / "+tot;
  var states=M.items.filter(function(f){ return f.kind==="state"; }), pois=M.items.filter(function(f){ return f.kind!=="state"; });
  var paths=states.map(function(f){ return '<path data-id="'+f.id+'" class="'+(M.sel===f.id?"pulse":"")+'" d="'+f.d+'" fill="'+mapCol(f,"#25314d")+'"/>'; }).join("");
  var marks=pois.map(mapMark).join("");
  var hits=states.filter(function(f){ return f.a<2500; }).map(function(f){ return '<circle class="hit" data-id="'+f.id+'" cx="'+f.x+'" cy="'+f.y+'" r="15"/>'; }).join("")
    +pois.map(function(f){ return '<circle class="hit" data-id="'+f.id+'" cx="'+f.x+'" cy="'+(f.y-2)+'" r="'+(f.kind==="range"||f.kind==="water"?19:15)+'"/>'; }).join("");
  var labs=M.items.filter(function(f){ return M.solved[f.id]; }).map(function(f){
    if(f.kind==="state") return '<text class="lb" x="'+f.x+'" y="'+(f.y+4)+'" style="font-size:'+(f.a<2500?8:f.a<13000?10:11)+'px">'+esc(M.mode==="cap"?CAPS[f.n]:mapShort(f))+'</text>';
    var lx=Math.max(50,Math.min(510,f.x)); return '<text x="'+lx+'" y="'+(f.y-(f.kind==="peak"||f.kind==="river"?14:0))+'" style="font-size:10px;font-weight:800;fill:#fff;paint-order:stroke;stroke:#0b0f17;stroke-width:3px;text-anchor:middle;pointer-events:none">'+esc(f.n)+'</text>'; }).join("");
  var sel=M.sel&&M.items.filter(function(f){ return f.id===M.sel; })[0], K={state:"Bundesland",peak:"Berg",range:"Gebirge",water:"Meer oder See",river:"Fluss"};
