  var m=pmode; if(!m||m.t==="helper"||t.cherry) return;
  if(m.t==="hswap"){
    if(t.stone||locked(t)){ snd('bad'); return; }
    if(!swapSel){ swapSel=t; sel=t; sync(); setInfo(T.tipSwapB); return; }
    if(swapSel===t){ swapSel=null; sel=null; sync(); setInfo(T.tipSwapA); return; }
    var a=swapSel; swapSel=null; sel=null; busy=true;
    rdy.splice(m.i,1); pmode=null; checkBar(); setInfo(null); hud();
    swapGrid(a,t); sync(); await sleep(280);
    await resolve([[a.r,a.c],[t.r,t.c]]); ensureMove();
  } else {
    busy=true; var set=new Set(), r,c;
    if(m.t==="cross"){ for(c=0;c<COLS;c++) if(grid[t.r][c]&&!grid[t.r][c].cherry) set.add(grid[t.r][c]); for(r=0;r<ROWS;r++) if(grid[r][t.c]&&!grid[r][t.c].cherry) set.add(grid[r][t.c]); }
    else { for(r=t.r-1;r<=t.r+1;r++) for(c=t.c-1;c<=t.c+1;c++) if(inb(r,c)&&grid[r][c]&&!grid[r][c].cherry) set.add(grid[r][c]); }
    rdy.splice(m.i,1); pmode=null; checkBar(); setInfo(null); hud();
    expand(set); await remove(set); await gravity(); await resolve(null); ensureMove();
  }
  busy=false; hud();
  if(done()) finish(true); else if(moves<=0) finish(false);
}
async function boosterHit(t){
  var id=boMode; boMode=null; drawBos(); setInfo(null); busy=true;
  var set=new Set();
  if(id==="hammer"){ if(!t.cherry) set.add(t); }
  else for(var c=0;c<COLS;c++){ if(grid[t.r][c]&&!grid[t.r][c].cherry) set.add(grid[t.r][c]); }
  spend(id); drawBos();
  expand(set); await remove(set); await gravity(); await resolve(null); ensureMove();
  busy=false; hud();
  if(done()) finish(true); else if(moves<=0) finish(false);
}
$("bos").addEventListener("click",function(e){ var b=e.target.closest(".bo"); if(b) useBooster(b.dataset.b); });
// Eingabe: Wischen oder zwei Tippen
var down=null;
$("board").addEventListener("pointerdown",function(e){ var el=e.target.closest(".t"); if(!el||busy||over) return; var t=findById(+el.dataset.id); down={t:t,x:e.clientX,y:e.clientY,done:false}; });
window.addEventListener("pointermove",function(e){
  if(!down||down.done||!down.t||boMode||pmode) return; var dx=e.clientX-down.x, dy=e.clientY-down.y;
  if(Math.abs(dx)<cs*0.3&&Math.abs(dy)<cs*0.3) return; down.done=true;
  var r=down.t.r+(Math.abs(dy)>Math.abs(dx)?(dy>0?1:-1):0), c=down.t.c+(Math.abs(dx)>=Math.abs(dy)?(dx>0?1:-1):0);
  if(inb(r,c)) trySwap(down.t,grid[r][c]);
});
window.addEventListener("pointerup",function(){
  if(down&&!down.done&&down.t&&pmode&&!busy&&!over){ powerHit(down.t); down=null; return; }
  if(down&&!down.done&&down.t&&boMode&&!busy&&!over){ boosterHit(down.t); down=null; return; }
  if(down&&!down.done&&down.t&&!down.t.stone){
    var t=down.t; if(sel&&sel!==t&&adj(sel,t)){ var s=sel; sel=null; trySwap(s,t); } else { sel=(sel===t?null:t); sync(); }
  }
  down=null;
});
function findById(id){ for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++){ var t=grid[r][c]; if(t&&t.id===id) return t; } return null; }
$("back").onclick=function(e){ e.preventDefault(); quit(); };
$("kbtn").onclick=function(){ showKings(false); };
$("mbtn").onclick=function(){ showMap(); };
$("bgbtn").onclick=function(){ showBgPicker(); };
$("title").textContent="🍓 "+T.title; document.title=T.title;
window.addEventListener("resize",function(){ if(!busy){ size(); sync(); } });
if(window.__noKings){ start(); } else { applyTheme(); showKings(true); }

})();
