<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Brain Defense</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#080b16;color:#eef;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#game{position:fixed;inset:0;display:flex;flex-direction:column}
.hud{display:flex;align-items:center;gap:6px;padding:8px 8px 6px;flex:0 0 auto}
.hb{width:34px;height:34px;border-radius:11px;background:#ffffff14;border:0;color:#eef;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 34px;font-weight:800}
.hud h1{font-size:13px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.hud h1 small{display:block;color:#9aa4c4;font-weight:600;font-size:11px}
.pl{display:flex;align-items:center;gap:4px;background:#ffffff14;border-radius:99px;padding:5px 8px;font-weight:800;font-size:13px;white-space:nowrap}
.pl svg{width:16px;height:16px}
#cvwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
canvas{border-radius:16px;box-shadow:0 0 0 1px #ffffff22,0 8px 30px #000a;touch-action:none}
.bar{flex:0 0 auto;display:flex;gap:8px;padding:8px 10px 12px;align-items:center;justify-content:center}
.bb{background:#ffffff14;color:#eef;border:0;border-radius:12px;padding:11px 14px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
.bb.pri{background:linear-gradient(135deg,#c6ff3d,#3de0ff);color:#08110c;flex:1;max-width:240px}
.bb.dis{opacity:.5}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#0d1226f2;border-top:2px solid #3de0ff;border-radius:18px 18px 0 0;padding:10px 10px 12px;display:none;z-index:6;max-width:460px;margin:0 auto}
.sheet.show{display:block}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tc{background:#151b30;border:2px solid var(--c);border-radius:12px;padding:4px 2px 5px;text-align:center;cursor:pointer;color:#eef;font-family:inherit}
.tc svg{display:block;margin:0 auto}
.tc b{display:block;font-size:10.5px;line-height:1.15}.tc i{display:block;font-style:normal;font-size:9.5px;color:#9aa4c4}.tc em{display:block;font-style:normal;font-weight:800;font-size:12px;color:#ffc83d}
.tc.no{opacity:.45}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:6px}.sh b{font-size:14px;flex:1}.sh span{font-size:11px;color:#9aa4c4}
.tst{display:flex;gap:6px;margin-bottom:8px}.tst div{flex:1;background:#ffffff0f;border-radius:10px;padding:6px;text-align:center;font-size:11px;color:#9aa4c4}.tst b{display:block;color:#fff;font-size:14px}
.ov{position:absolute;inset:0;background:rgba(5,8,20,.86);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
.ov.show{display:flex}.box{background:#121a2e;border:3px solid #c6ff3d;border-radius:20px;padding:22px;text-align:center;max-width:340px;width:100%}
.box h2{margin:0 0 6px;font-size:26px}.box p{color:#b7c0dc;margin:0 0 14px;font-size:14px}.stars{font-size:34px;letter-spacing:4px;margin-bottom:8px}
.btn{background:#ffffff14;color:#eef;border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}.pri{background:linear-gradient(135deg,#c6ff3d,#3de0ff);color:#08110c}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tab{flex:1;background:#ffffff10;border:2px solid transparent;border-radius:10px;padding:7px;text-align:center;font-weight:800;font-size:13px;color:#cfd6f0;cursor:pointer;font-family:inherit}.tab.on{border-color:#3de0ff;background:#3de0ff22;color:#fff}
#hmenu{position:fixed;inset:0;background:#080b16;z-index:40;overflow:auto;display:none;touch-action:pan-y}#hmenu.show{display:block}
.hc{background:#10162b;border:2px solid var(--c);border-radius:16px;padding:10px;display:flex;gap:10px;align-items:center;margin:0 12px 10px}
.hc .hi{flex:0 0 84px}.hc .hx{flex:1;min-width:0}.hc b{display:block;font-size:14px}.hc small{display:block;color:#9aa4c4;font-size:11.5px;margin:2px 0 6px}.hc .hv{font-size:12px;color:#7cff8c;font-weight:700;margin-bottom:6px}
.hbtn{background:linear-gradient(135deg,#d9a35a,#ffd75e);color:#2a1604;border:0;border-radius:10px;padding:9px 12px;font-weight:900;font-size:13px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}.hbtn.dis{opacity:.45}
/* Karte */
#mapscr{position:fixed;inset:0;background:#080b16;z-index:30;overflow:auto;display:none;touch-action:pan-y}
#mapscr.show{display:block}
.mhd{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;background:#0a0d16ee}.mhd b{flex:1;font-size:15px}
.mapw{max-width:420px;margin:0 auto;display:flex;flex-direction:column-reverse}
.mz{position:relative;width:100%;overflow:visible}.mz svg{position:absolute;left:0;top:0;overflow:visible}.mlab{position:absolute;left:0;right:0;text-align:center;z-index:3}.mlab b{background:#000b;border:2px solid #fff6;border-radius:99px;padding:6px 14px;font-size:12px;color:#fff}
.mnote{text-align:center;font-size:11px;color:#9aa4c4;padding:2px 12px 10px}
@keyframes pu{50%{transform:scale(1.12)}}.pulse{animation:pu 1.1s infinite;transform-box:fill-box;transform-origin:center}
</style></head><body>
<div id="game">
 <div class="hud"><button class="hb" id="bBack">←</button><h1 id="ttl"></h1><div class="pl" id="plLife"></div><div class="pl" id="plCoin"></div><div class="pl" id="plCoco"></div></div>
 <div id="cvwrap"><canvas id="cv"></canvas>
  <div class="sheet" id="sheet"></div>
  <div class="ov" id="ov"><div class="box"><div class="stars" id="ost"></div><h2 id="ot"></h2><p id="op"></p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn pri" id="o1"></button><button class="btn" id="o2"></button></div></div></div>
 </div>
 <div class="bar"><button class="bb" id="bMap">Karte</button><button class="bb pri" id="bWave"></button><button class="bb" id="bSpd">x1</button><button class="bb" id="bPause">II</button></div>
</div>
<div id="mapscr"></div>
